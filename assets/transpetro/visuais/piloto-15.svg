<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="title desc"><title id="title">Planta: comprimento das rotas disponíveis</title><desc id="desc">Coordenadas em metros: P(1,1),X(3,1),Y(3,7),saídaA(1,7),saídaB(9,1). Só rotasA: P-X-Y-A e B: P-B são permitidas. Sem diagonais. Escala 1 divisão 1 m.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#243b55"/></marker></defs><rect width="900" height="500" fill="white"/><text x="40" y="38" font-size="23" text-anchor="start" fill="#172b45">Planta: comprimento das rotas disponíveis</text><g font-family="Arial, sans-serif"><line x1="100" y1="90" x2="100" y2="370" stroke="#d8e2ee" stroke-width="1"/><text x="100" y="395" font-size="14" text-anchor="middle" fill="#172b45">0</text><line x1="135" y1="90" x2="135" y2="370" stroke="#d8e2ee" stroke-width="1"/><text x="135" y="395" font-size="14" text-anchor="middle" fill="#172b45">1</text><line x1="170" y1="90" x2="170" y2="370" stroke="#d8e2ee" stroke-width="1"/><text x="170" y="395" font-size="14" text-anchor="middle" fill="#172b45">2</text><line x1="205" y1="90" x2="205" y2="370" stroke="#d8e2ee" stroke-width="1"/><text x="205" y="395" font-size="14" text-anchor="middle" fill="#172b45">3</text><line x1="240" y1="90" x2="240" y2="370" stroke="#d8e2ee" stroke-width="1"/><text x="240" y="395" font-size="14" text-anchor="middle" fill="#172b45">4</text><line x1="275" y1="90" x2="275" y2="370" stroke="#d8e2ee" stroke-width="1"/><text x="275" y="395" font-size="14" text-anchor="middle" fill="#172b45">5</text><line x1="310" y1="90" x2="310" y2="370" stroke="#d8e2ee" stroke-width="1"/><text x="310" y="395" font-size="14" text-anchor="middle" fill="#172b45">6</text><line x1="345" y1="90" x2="345" y2="370" stroke="#d8e2ee" stroke-width="1"/><text x="345" y="395" font-size="14" text-anchor="middle" fill="#172b45">7</text><line x1="380" y1="90" x2="380" y2="370" stroke="#d8e2ee" stroke-width="1"/><text x="380" y="395" font-size="14" text-anchor="middle" fill="#172b45">8</text><line x1="415" y1="90" x2="415" y2="370" stroke="#d8e2ee" stroke-width="1"/><text x="415" y="395" font-size="14" text-anchor="middle" fill="#172b45">9</text><line x1="450" y1="90" x2="450" y2="370" stroke="#d8e2ee" stroke-width="1"/><text x="450" y="395" font-size="14" text-anchor="middle" fill="#172b45">10</text><line x1="100" y1="370" x2="450" y2="370" stroke="#d8e2ee" stroke-width="1"/><text x="85" y="375" font-size="14" text-anchor="end" fill="#172b45">0</text><line x1="100" y1="335" x2="450" y2="335" stroke="#d8e2ee" stroke-width="1"/><text x="85" y="340" font-size="14" text-anchor="end" fill="#172b45">1</text><line x1="100" y1="300" x2="450" y2="300" stroke="#d8e2ee" stroke-width="1"/><text x="85" y="305" font-size="14" text-anchor="end" fill="#172b45">2</text><line x1="100" y1="265" x2="450" y2="265" stroke="#d8e2ee" stroke-width="1"/><text x="85" y="270" font-size="14" text-anchor="end" fill="#172b45">3</text><line x1="100" y1="230" x2="450" y2="230" stroke="#d8e2ee" stroke-width="1"/><text x="85" y="235" font-size="14" text-anchor="end" fill="#172b45">4</text><line x1="100" y1="195" x2="450" y2="195" stroke="#d8e2ee" stroke-width="1"/><text x="85" y="200" font-size="14" text-anchor="end" fill="#172b45">5</text><line x1="100" y1="160" x2="450" y2="160" stroke="#d8e2ee" stroke-width="1"/><text x="85" y="165" font-size="14" text-anchor="end" fill="#172b45">6</text><line x1="100" y1="125" x2="450" y2="125" stroke="#d8e2ee" stroke-width="1"/><text x="85" y="130" font-size="14" text-anchor="end" fill="#172b45">7</text><line x1="100" y1="90" x2="450" y2="90" stroke="#d8e2ee" stroke-width="1"/><text x="85" y="95" font-size="14" text-anchor="end" fill="#172b45">8</text><text x="270" y="430" font-size="17" text-anchor="middle" fill="#172b45">Coordenadas em metros</text><rect x="100" y="195" width="70" height="70" fill="#bfc7d2" stroke="#244e87" stroke-width="2"/><text x="160" y="195" font-size="16" text-anchor="start" fill="#172b45">Bloqueio</text><polyline points="135,335 205,335 205,125 135,125" fill="none" stroke="#2459a6" stroke-width="4"/><polyline points="135,335 415,335" fill="none" stroke="#a64427" stroke-width="4"/><circle cx="135" cy="335" r="4" fill="#356cb3"/><text x="140" y="330" font-size="16" text-anchor="start" fill="#172b45">P</text><circle cx="205" cy="335" r="4" fill="#356cb3"/><text x="210" y="330" font-size="16" text-anchor="start" fill="#172b45">X</text><circle cx="205" cy="125" r="4" fill="#356cb3"/><text x="210" y="120" font-size="16" text-anchor="start" fill="#172b45">Y</text><circle cx="135" cy="125" r="4" fill="#356cb3"/><text x="140" y="120" font-size="16" text-anchor="start" fill="#172b45">SaídaA</text><circle cx="415" cy="335" r="4" fill="#356cb3"/><text x="420" y="330" font-size="16" text-anchor="start" fill="#172b45">SaídaB</text><text x="500" y="140" font-size="17" text-anchor="start" fill="#172b45">Rotas permitidas, sem diagonais:</text><text x="500" y="180" font-size="18" text-anchor="start" fill="#172b45">A: P→X→Y→SaídaA</text><text x="500" y="220" font-size="18" text-anchor="start" fill="#172b45">B: P→SaídaB</text><text x="500" y="280" font-size="18" text-anchor="start" fill="#172b45">Escala: 1 divisão=1 m</text><text x="40" y="482" font-size="15" text-anchor="start" fill="#172b45">Dados hipotéticos • modelo didático • sem limite legal • figura autoral</text></g></svg>