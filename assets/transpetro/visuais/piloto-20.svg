<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="title desc"><title id="title">Sensibilidade um fator por vez</title><desc id="desc">Faixas do resultado ao variar um fator de cada vez, demais fixos: pressão 2 a 12; temperatura 6 a 8; ocupação 4 a 9. Eixo horizontal resultado do mesmo modelo em unidades esperadas/ano.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#243b55"/></marker></defs><rect width="900" height="500" fill="white"/><text x="40" y="38" font-size="23" text-anchor="start" fill="#172b45">Sensibilidade um fator por vez</text><g font-family="Arial, sans-serif"><line x1="200" y1="390" x2="800" y2="390" stroke="#344963" stroke-width="2"/><text x="200" y="420" font-size="16" text-anchor="middle" fill="#172b45">0</text><text x="290" y="420" font-size="16" text-anchor="middle" fill="#172b45">2</text><text x="380" y="420" font-size="16" text-anchor="middle" fill="#172b45">4</text><text x="470" y="420" font-size="16" text-anchor="middle" fill="#172b45">6</text><text x="560" y="420" font-size="16" text-anchor="middle" fill="#172b45">8</text><text x="650" y="420" font-size="16" text-anchor="middle" fill="#172b45">10</text><text x="740" y="420" font-size="16" text-anchor="middle" fill="#172b45">12</text><text x="175" y="146" font-size="18" text-anchor="end" fill="#172b45">Pressão</text><rect x="290" y="120" width="450" height="40" fill="#e8f1ff" stroke="#244e87" stroke-width="2"/><text x="290" y="110" font-size="16" text-anchor="middle" fill="#172b45">2</text><text x="740" y="110" font-size="16" text-anchor="middle" fill="#172b45">12</text><text x="175" y="246" font-size="18" text-anchor="end" fill="#172b45">Temperatura</text><rect x="470" y="220" width="90" height="40" fill="#e8f1ff" stroke="#244e87" stroke-width="2"/><text x="470" y="210" font-size="16" text-anchor="middle" fill="#172b45">6</text><text x="560" y="210" font-size="16" text-anchor="middle" fill="#172b45">8</text><text x="175" y="346" font-size="18" text-anchor="end" fill="#172b45">Ocupação</text><rect x="380" y="320" width="225" height="40" fill="#e8f1ff" stroke="#244e87" stroke-width="2"/><text x="380" y="310" font-size="16" text-anchor="middle" fill="#172b45">4</text><text x="605" y="310" font-size="16" text-anchor="middle" fill="#172b45">9</text><text x="500" y="450" font-size="16" text-anchor="middle" fill="#172b45">Resultado do modelo (unidades de risco esperadas/ano)</text><text x="40" y="482" font-size="15" text-anchor="start" fill="#172b45">Dados hipotéticos • modelo didático • sem limite legal • figura autoral</text></g></svg>