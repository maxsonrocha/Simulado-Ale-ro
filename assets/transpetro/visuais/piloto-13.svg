<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="title desc"><title id="title">Colunas de suporte de uma plataforma: comprimentos efetivos</title><desc id="desc">Coluna 1: L 3 m,K 1. Coluna 2: L 4 m,K 0,5. Mesmo produtoEI; Pcr=pi²EI/(KL)². Desenho esquemático, cotas prevalecem sobre desenho.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#243b55"/></marker></defs><rect width="900" height="500" fill="white"/><text x="40" y="38" font-size="23" text-anchor="start" fill="#172b45">Colunas de suporte de uma plataforma: comprimentos efetivos</text><g font-family="Arial, sans-serif"><rect x="150" y="160" width="35" height="220" fill="#e8f1ff" stroke="#244e87" stroke-width="2"/><rect x="480" y="90" width="35" height="290" fill="#e8f1ff" stroke="#244e87" stroke-width="2"/><text x="120" y="120" font-size="22" text-anchor="start" fill="#172b45">Coluna 1</text><text x="440" y="72" font-size="22" text-anchor="start" fill="#172b45">Coluna 2</text><text x="210" y="220" font-size="22" text-anchor="start" fill="#172b45">L=3 m; K=1</text><text x="550" y="180" font-size="22" text-anchor="start" fill="#172b45">L=4 m; K=0,5</text><text x="75" y="430" font-size="18" text-anchor="start" fill="#172b45">MesmoEI; modelo elástico Pcr=π²EI/(KL)²; não inclui imperfeições.</text><text x="40" y="482" font-size="15" text-anchor="start" fill="#172b45">Dados hipotéticos • modelo didático • sem limite legal • figura autoral</text></g></svg>