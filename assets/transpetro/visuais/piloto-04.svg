<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="title desc"><title id="title">Planta: zona geométrica de planejamento</title><desc id="desc">Plano cartesiano em metros. Centro(4,3), raio 3 m. PontosP(4; 6,5),Q(6; 5),R(8; 3). Círculo é critério interno hipotético.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#243b55"/></marker></defs><rect width="900" height="500" fill="white"/><text x="40" y="38" font-size="23" text-anchor="start" fill="#172b45">Planta: zona geométrica de planejamento</text><g font-family="Arial, sans-serif"><line x1="100" y1="90" x2="100" y2="370" stroke="#d8e2ee" stroke-width="1"/><text x="100" y="395" font-size="14" text-anchor="middle" fill="#172b45">0</text><line x1="135" y1="90" x2="135" y2="370" stroke="#d8e2ee" stroke-width="1"/><text x="135" y="395" font-size="14" text-anchor="middle" fill="#172b45">1</text><line x1="170" y1="90" x2="170" y2="370" stroke="#d8e2ee" stroke-width="1"/><text x="170" y="395" font-size="14" text-anchor="middle" fill="#172b45">2</text><line x1="205" y1="90" x2="205" y2="370" stroke="#d8e2ee" stroke-width="1"/><text x="205" y="395" font-size="14" text-anchor="middle" fill="#172b45">3</text><line x1="240" y1="90" x2="240" y2="370" stroke="#d8e2ee" stroke-width="1"/><text x="240" y="395" font-size="14" text-anchor="middle" fill="#172b45">4</text><line x1="275" y1="90" x2="275" y2="370" stroke="#d8e2ee" stroke-width="1"/><text x="275" y="395" font-size="14" text-anchor="middle" fill="#172b45">5</text><line x1="310" y1="90" x2="310" y2="370" stroke="#d8e2ee" stroke-width="1"/><text x="310" y="395" font-size="14" text-anchor="middle" fill="#172b45">6</text><line x1="345" y1="90" x2="345" y2="370" stroke="#d8e2ee" stroke-width="1"/><text x="345" y="395" font-size="14" text-anchor="middle" fill="#172b45">7</text><line x1="380" y1="90" x2="380" y2="370"