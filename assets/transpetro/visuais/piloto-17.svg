<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="title desc"><title id="title">Distribuição agrupada de duração de afastamentos</title><desc id="desc">Faixas[0,5),[5,10),[10,20),[20,40)dias com frequências 9,2,8,1. Barras categóricas de mesma largura, não histograma de densidade.20 registros.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#243b55"/></marker></defs><rect width="900" height="500" fill="white"/><text x="40" y="38" font-size="23" text-anchor="start" fill="#172b45">Distribuição agrupada de duração de afastamentos</text><g font-family="Arial, sans-serif"><line x1="90" y1="390" x2="810" y2="390" stroke="#344963" stroke-width="2"/><line x1="90" y1="90" x2="90" y2="390" stroke="#344963" stroke-width="2"/><text x="450" y="440" font-size="18" text-anchor="middle" fill="#172b45">Faixa de dias (não é escala de tempo contínua)</text><text x="90" y="72" font-size="18" text-anchor="start" fill="#172b45">Número de registros</text><line x1="90" y1="390.0" x2="810" y2="390.0" stroke="#dce3eb" stroke-width="1"/><text x="78" y="396.0" font-size="15" text-anchor="end" fill="#172b45">0.0</text><line x1="90" y1="330.0" x2="810" y2="330.0" stroke="#dce3eb" stroke-width="1"/><text x="78" y="336.0" font-size="15" text-anchor="end" fill="#172b45">2.0</text><line x1="90" y1="270.0" x2="810" y2="270.0" stroke="#dce3eb" stroke-width="1"/><text x="78" y="276.0" font-size="15" text-anchor="end" fill="#172b45">4.0</text><line x1="90" y1="210.0" x2="810" y2="210.0" stroke="#dce3eb" stroke-width="1"/><text x="78" y="216.0" font-size="15" text-anchor="end" fill="#172b45">6.0</text><line x1="90" y1="150.0" x2="810" y2="150.0" stroke="#dce3eb" stroke-width="1"/><text x="78" y="156.0" font-size="15" text-anchor="end" fill="#172b45">8.0</text><line x1="90" y1="90.0" x2="810" y2="90.0" stroke="#dce3eb" stroke-width="1"/><text x="78" y="96.0" font-size="15" text-anchor="end" fill="#172b45">10.0</text><rect x="190" y="120" width="100" height="270" fill="#e8f1ff" stroke="#244e87" stroke-width="2"/><text x="240" y="420" font-size="16" text-anchor="middle" fill="#172b45">[0,5)</text><text x="240" y="110" font-size="17" text-anchor="middle" fill="#172b45">9</text><rect x="340" y="330" width="100" height="60" fill="#e8f1ff" stroke="#244e87" stroke-width="2"/><text x="390" y="420" font-size="16" text-anchor="middle" fill="#172b45">[5,10)</text><text x="390" y="320" font-size="17" text-anchor="middle" fill="#172b45">2</text><rect x="490" y="150" width="100" height="240" fill="#e8f1ff" stroke="#244e87" stroke-width="2"/><text x="540" y="420" font-size="16" text-anchor="middle" fill="#172b45">[10,20)</text><text x="540" y="140" font-size="17" text-anchor="middle" fill="#172b45">8</text><rect x="640" y="360" width="100" height="30" fill="#e8f1ff" stroke="#244e87" stroke-width="2"/><text x="690" y="420" font-size="16" text-anchor="middle" fill="#172b45">[20,40)</text><text x="690" y="350" font-size="17" text-anchor="middle" fill="#172b45">1</text><text x="40" y="482" font-size="15" text-anchor="start" fill="#172b45">Dados hipotéticos • modelo didático • sem limite legal • figura autoral</text></g></svg>