<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="title desc"><title id="title">Balanço de água e fronteira de captação</title><desc id="desc">Processo produz 5 t/h; capta 20 m³/h externamente, evapora 12 m³/h e descarrega 8 m³/h; recircula internamente 100 m³/h. Regime estacionário, sem outras entradas/saídas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#243b55"/></marker></defs><rect width="900" height="500" fill="white"/><text x="40" y="38" font-size="23" text-anchor="start" fill="#172b45">Balanço de água e fronteira de captação</text><g font-family="Arial, sans-serif"><rect x="230" y="135" width="420" height="320" fill="none" stroke="#68778a" stroke-dasharray="6 4"/><text x="235" y="125" font-size="15" text-anchor="start" fill="#172b45">Fronteira externa (tracejado)</text><rect x="330" y="160" width="240" height="160" fill="#e8f1ff" stroke="#244e87" stroke-width="2"/><text x="450" y="225" font-size="24" text-anchor="middle" fill="#172b45">Processo</text><text x="450" y="265" font-size="20" text-anchor="middle" fill="#172b45">Produção: 5 t/h</text><polyline points="80.0,240.0 205.0,240.0 330.0,240.0" fill="none" marker-mid="url(#arrow)" stroke="#2459a6" stroke-width="10"/><text x="80" y="210" font-size="19" text-anchor="start" fill="#172b45">Captação 20 m³/h</text><polyline points="570.0,210.0 680.0,160.0 790.0,110.0" fill="none" marker-mid="url(#arrow)" stroke="#af5932" stroke-width="7"/><text x="610" y="85" font-size="18" text-anchor="start" fill="#172b45">Evaporação 12 m³/h</text><polyline points="570.0,280.0 680.0,315.0 790.0,350.0" fill="none" marker-mid="url(#arrow)" stroke="#2459a6" stroke-width="6"/><text x="675" y="395" font-size="18" text-anchor="start" fill="#172b45">Descarga 8 m³/h</text><polyline points="500,320 500,430 260,430 260,290 330,290" fill="none" stroke="#2f855d" stroke-width="5"/><text x="285" y="400" font-size="16" text-anchor="start" fill="#172b45">Recirculação interna 100 m³/h</text><text x="40" y="482" font-size="15" text-anchor="start" fill="#172b45">Dados hipotéticos • modelo didático • sem limite legal • figura autoral</text></g></svg>