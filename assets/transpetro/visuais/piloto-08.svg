<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="title desc"><title id="title">Destinos mutuamente exclusivos de 100 cenários</title><desc id="desc">De 100 cenários: 25 controlados antes da liberação,45 contidos após a liberação,30 não controlados. Três ramos exclusivos e completos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#243b55"/></marker></defs><rect width="900" height="500" fill="white"/><text x="40" y="38" font-size="23" text-anchor="start" fill="#172b45">Destinos mutuamente exclusivos de 100 cenários</text><g font-family="Arial, sans-serif"><rect x="65" y="218" width="70" height="44" fill="#e8f1ff" stroke="#244e87" stroke-width="2"/><text x="100" y="246" font-size="19" text-anchor="middle" fill="#172b45">100</text><polyline points="135.0,240.0 237.5,190.0 340.0,140.0" fill="none" marker-mid="url(#arrow)" stroke="#344963" stroke-width="2"/><polyline points="135.0,240.0 237.5,245.0 340.0,250.0" fill="none" marker-mid="url(#arrow)" stroke="#344963" stroke-width="2"/><polyline points="135.0,240.0 237.5,300.0 340.0,360.0" fill="none" marker-mid="url(#arrow)" stroke="#344963" stroke-width="2"/><rect x="345" y="118" width="70" height="44" fill="#e8f1ff" stroke="#244e87" stroke-width="2"/><text x="380" y="146" font-size="19" text-anchor="middle" fill="#172b45">25</text><text x="440" y="146" font-size="19" text-anchor="start" fill="#172b45">Controlados antes da liberação</text><rect x="345" y="228" width="70" height="44" fill="#e8f1ff" stroke="#244e87" stroke-width="2"/><text x="380" y="256" font-size="19" text-anchor="middle" fill="#172b45">45</text><text x="440" y="256" font-size="19" text-anchor="start" fill="#172b45">Contidos após liberação</text><rect x="345" y="338" width="70" height="44" fill="#e8f1ff" stroke="#244e87" stroke-width="2"/><text x="380" y="366" font-size="19" text-anchor="middle" fill="#172b45">30</text><text x="440" y="366" font-size="19" text-anchor="start" fill="#172b45">Não controlados</text><text x="40" y="482" font-size="15" text-anchor="start" fill="#172b45">Dados hipotéticos • modelo didático • sem limite legal • figura autoral</text></g></svg>