<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="title desc"><title id="title">Fluxos de reclassificação de registros</title><desc id="desc">InicialmenteA 30 e B 20. Dez registros migram de A para B; cinco migram de B para A. Não entram nem saem registros do conjunto.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#243b55"/></marker></defs><rect width="900" height="500" fill="white"/><text x="40" y="38" font-size="23" text-anchor="start" fill="#172b45">Fluxos de reclassificação de registros</text><g font-family="Arial, sans-serif"><rect x="125" y="128" width="70" height="44" fill="#e8f1ff" stroke="#244e87" stroke-width="2"/><text x="160" y="156" font-size="19" text-anchor="middle" fill="#172b45">A: 30</text><rect x="125" y="308" width="70" height="44" fill="#e8f1ff" stroke="#244e87" stroke-width="2"/><text x="160" y="336" font-size="19" text-anchor="middle" fill="#172b45">B: 20</text><polyline points="205.0,155.0 392.5,227.5 580.0,300.0" fill="none" marker-mid="url(#arrow)" stroke="#a34444" stroke-width="5"/><text x="380" y="200" font-size="20" text-anchor="middle" fill="#172b45">10 de A para B</text><polyline points="205.0,320.0 392.5,240.0 580.0,160.0" fill="none" marker-mid="url(#arrow)" stroke="#2459a6" stroke-width="5"/><text x="380" y="330" font-size="20" text-anchor="middle" fill="#172b45">5 de B para A</text><text x="580" y="110" font-size="18" text-anchor="start" fill="#172b45">Reclassificação</text><text x="600" y="166" font-size="17" text-anchor="start" fill="#172b45">DestinoA</text><text x="600" y="315" font-size="17" text-anchor="start" fill="#172b45">DestinoB</text><text x="580" y="390" font-size="17" text-anchor="start" fill="#172b45">Sem novas entradas ou exclusões</text><text x="40" y="482" font-size="15" text-anchor="start" fill="#172b45">Dados hipotéticos • modelo didático • sem limite legal • figura autoral</text></g></svg>