<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="title desc"><title id="title">Inventário energético em planta simplificada</title><desc id="desc">Piso 6 m por 5 m. Quatro recipientes com 25 kg de combustível cada, com 20 MJ/kg. Embalagens 60 kg,15 MJ/kg. Modeloq=soma massa×poder calorífico/área.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#243b55"/></marker></defs><rect width="900" height="500" fill="white"/><text x="40" y="38" font-size="23" text-anchor="start" fill="#172b45">Inventário energético em planta simplificada</text><g font-family="Arial, sans-serif"><rect x="70" y="80" width="360" height="300" fill="#e8f1ff" stroke="#244e87" stroke-width="2"/><text x="250" y="110" font-size="19" text-anchor="middle" fill="#172b45">Área do piso: 6 m× 5 m</text><circle cx="160" cy="180" r="35" fill="#c6daf4"/><text x="160" y="185" font-size="17" text-anchor="middle" fill="#172b45">25 kg</text><circle cx="320" cy="180" r="35" fill="#c6daf4"/><text x="320" y="185" font-size="17" text-anchor="middle" fill="#172b45">25 kg</text><circle cx="160" cy="290" r="35" fill="#c6daf4"/><text x="160" y="295" font-size="17" text-anchor="middle" fill="#172b45">25 kg</text><circle cx="320" cy="290" r="35" fill="#c6daf4"/><text x="320" y="295" font-size="17" text-anchor="middle" fill="#172b45">25 kg</text><text x="480" y="130" font-size="20" text-anchor="start" fill="#172b45">4 recipientes; combustível: 25 kg/cada</text><text x="480" y="175" font-size="19" text-anchor="start" fill="#172b45">Poder calorífico: 20 MJ/kg</text><text x="480" y="235" font-size="20" text-anchor="start" fill="#172b45">Embalagens: 60 kg</text><text x="480" y="280" font-size="19" text-anchor="start" fill="#172b45">Poder calorífico: 15 MJ/kg</text><text x="70" y="430" font-size="18" text-anchor="start" fill="#172b45">Modelo: q=Σ(massa×poder calorífico)/área de piso.</text><text x="40" y="482" font-size="15" text-anchor="start" fill="#172b45">Dados hipotéticos • modelo didático • sem limite legal • figura autoral</text></g></svg>