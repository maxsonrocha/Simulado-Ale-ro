<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="title desc"><title id="title">Planta de cobertura de vistorias</title><desc id="desc">Em metros: A cobre retângulo 0≤x≤6 e 2≤y≤6; B cobre 4≤x≤9 e 0≤y≤4. PontosP(2,4),Q(5,3),R(8,5),S(8,2). Cobertura de busca apenas, não capacidade de sensor.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#243b55"/></marker></defs><rect width="900" height="500" fill="white"/><text x="40" y="38" font-size="23" text-anchor="start" fill="#172b45">Planta de cobertura de vistorias</text><g font-family="Arial, sans-serif"><line x1="100" y1="90" x2="100" y2="370" stroke="#d8e2ee" stroke-width="1"/><text x="100" y="395" font-size="14" text-anchor="middle" fill="#172b45">0</text><line x1="135" y1="90" x2="135" y2="370" stroke="#d8e2ee" stroke-width="1"/><text x="135" y="395" font-size="14" text-anchor="middle" fill="#172b45">1</text><line x1="170" y1="90" x2="170" y2="370" stroke="#d8e2ee" stroke-width="1"/><text x="170" y="395" font-size="14" text-anchor="middle" fill="#172b45">2</text><line x1="205" y1="90" x2="205" y2="370" stroke="#d8e2ee" stroke-width="1"/><text x="205" y="395" font-size="14" text-anchor="middle" fill="#172b45">3</text><line x1="240" y1="90" x2="240" y2="370" stroke="#d8e2ee" stroke-width="1"/><text x="240" y="395" font-size="14" text-anchor="middle" fill="#172b45">4</text><line x1="275" y1="90" x2="275" y2="370" stroke="#d8e2ee" stroke-width="1"/><text x="275" y="395" font-size="14" text-anchor="middle" fill="#172b45">5</text><line x1="310" y1="90" x2="310" y2="370" stroke="#d8e2ee" stroke-width="1"/><text x="310" y="395" font-size="14" text-anchor="middle" fill="#172b45">6</text><line x1="345" y1="90" x2="345" y2="370" stroke="#d8e2ee" stroke-width="1"/><text x="345" y="395" font-size="14" text-anchor="middle" fill="#172b45">7</text><line x1="380" y1="90" x2="380" y2="370" stroke="#d8e2ee" stroke-width="1"/><text x="380" y="395" font-size="14" text-anchor="middle" fill="#172b45">8</text><line x1="415" y1="90" x2="415" y2="370" stroke="#d8e2ee" stroke-width="1"/><text x="415" y="395" font-size="14" text-anchor="middle" fill="#172b45">9</text><line x1="450" y1="90" x2="450" y2="370" stroke="#d8e2ee" stroke-width="1"/><text x="450" y="395" font-size="14" text-anchor="middle" fill="#172b45">10</text><line x1="100" y1="370" x2="450" y2="370" stroke="#d8e2ee" stroke-width="1"/><text x="85" y="375" font-size="14" text-anchor="end" fill="#172b45">0</text><line x1="100" y1="335" x2="450" y2="335" stroke="#d8e2ee" stroke-width="1"/><text x="85" y="340" font-size="14" text-anchor="end" fill="#172b45">1</text><line x1="100" y1="300" x2="450" y2="300" stroke="#d8e2ee" stroke-width="1"/><text x="85" y="305" font-size="14" text-anchor="end" fill="#172b45">2</text><line x1="100" y1="265" x2="450" y2="265" stroke="#d8e2ee" stroke-width="1"/><text x="85" y="270" font-size="14" text-anchor="end" fill="#172b45">3</text><line x1="100" y1="230" x2="450" y2="230" stroke="#d8e2ee" stroke-width="1"/><text x="85" y="235" font-size="14" text-anchor="end" fill="#172b45">4</text><line x1="100" y1="195" x2="450" y2="195" stroke="#d8e2ee" stroke-width="1"/><text x="85" y="200" font-size="14" text-anchor="end" fill="#172b45">5</text><line x1="100" y1="160" x2="450" y2="160" stroke="#d8e2ee" stroke-width="1"/><text x="85" y="165" font-size="14" text-anchor="end" fill="#172b45">6</text><line x1="100" y1="125" x2="450" y2="125" stroke="#d8e2ee" stroke-width="1"/><text x="85" y="130" font-size="14" text-anchor="end" fill="#172b45">7</text><line x1="100" y1="90" x2="450" y2="90" stroke="#d8e2ee" stroke-width="1"/><text x="85" y="95" font-size="14" text-anchor="end" fill="#172b45">8</text><text x="270" y="430" font-size="17" text-anchor="middle" fill="#172b45">Coordenadas em metros</text><rect x="100" y="160" width="210" height="140" fill="#dae7ff" fill-opacity="0.4" stroke="#244e87" stroke-width="2"/><rect x="240" y="230" width="175" height="140" fill="#ffdbb8" fill-opacity="0.4" stroke="#244e87" stroke-width="2"/><text x="510" y="140" font-size="17" text-anchor="start" fill="#172b45">VistoriaA: 0≤x≤6; 2≤y≤6</text><text x="510" y="180" font-size="17" text-anchor="start" fill="#172b45">VistoriaB: 4≤x≤9; 0≤y≤4</text><circle cx="170" cy="230" r="5" fill="#111"/><text x="176" y="224" font-size="18" text-anchor="start" fill="#172b45">P</text><circle cx="275" cy="265" r="5" fill="#111"/><text x="281" y="259" font-size="18" text-anchor="start" fill="#172b45">Q</text><circle cx="380" cy="195" r="5" fill="#111"/><text x="386" y="189" font-size="18" text-anchor="start" fill="#172b45">R</text><circle cx="380" cy="300" r="5" fill="#111"/><text x="386" y="294" font-size="18" text-anchor="start" fill="#172b45">S</text><text x="40" y="482" font-size="15" text-anchor="start" fill="#172b45">Dados hipotéticos • modelo didático • sem limite legal • figura autoral</text></g></svg>