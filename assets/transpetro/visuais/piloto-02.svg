<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="title desc"><title id="title">Dispersão de um marcador em dois grupos</title><desc id="desc">Boxplots: grupo A mínimo 10,Q 1=15,mediana 20,Q 3=25,máximo 30; grupo B mínimo 0,Q 1=5,mediana 20,Q 3=35,máximo 40. Unidades relativas, sem interpretação clínica.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#243b55"/></marker></defs><rect width="900" height="500" fill="white"/><text x="40" y="38" font-size="23" text-anchor="start" fill="#172b45">Dispersão de um marcador em dois grupos</text><g font-family="Arial, sans-serif"><line x1="120" y1="390" x2="800" y2="390" stroke="#344963" stroke-width="2"/><line x1="120" y1="385" x2="120" y2="395" stroke="#344963" stroke-width="2"/><text x="120" y="420" font-size="16" text-anchor="middle" fill="#172b45">0</text><line x1="205" y1="385" x2="205" y2="395" stroke="#344963" stroke-width="2"/><text x="205" y="420" font-size="16" text-anchor="middle" fill="#172b45">5</text><line x1="290" y1="385" x2="290" y2="395" stroke="#344963" stroke-width="2"/><text x="290" y="420" font-size="16" text-anchor="middle" fill="#172b45">10</text><line x1="375" y1="385" x2="375" y2="395" stroke="#344963" stroke-width="2"/><text x="375" y="420" font-size="16" text-anchor="middle" fill="#172b45">15</text><line x1="460" y1="385" x2="460" y2="395" stroke="#344963" stroke-width="2"/><text x="460" y="420" font-size="16" text-anchor="middle" fill="#172b45">20</text><line x1="545" y1="385" x2="545" y2="395" stroke="#344963" stroke-width="2"/><text x="545" y="420" font-size="16" text-anchor="middle" fill="#172b45">25</text><line x1="630" y1="385" x2="630" y2="395" stroke="#344963" stroke-width="2"/><text x="630" y="420" font-size="16" text-anchor="middle" fill="#172b45">30</text><line x1="715" y1="385" x2="715" y2="395" stroke="#344963" stroke-width="2"/><text x="715" y="420" font-size="16" text-anchor="middle" fill="#172b45">35</text><line x1="800" y1="385" x2="800" y2="395" stroke="#344963" stroke-width="2"/><text x="800" y="420" font-size="16" text-anchor="middle" fill="#172b45">40</text><text x="60" y="170" font-size="18" text-anchor="start" fill="#172b45">A</text><line x1="290" y1="170" x2="630" y2="170" stroke="#344963" stroke-width="2"/><rect x="375" y="145" width="170" height="50" fill="#e8f1ff" stroke="#244e87" stroke-width="2"/><line x1="460" y1="145" x2="460" y2="195" stroke="#a62b2b" stroke-width="4"/><text x="60" y="290" font-size="18" text-anchor="start" fill="#172b45">B</text><line x1="120" y1="290" x2="800" y2="290" stroke="#344963" stroke-width="2"/><rect x="205" y="265" width="510" height="50" fill="#e8f1ff" stroke="#244e87" stroke-width="2"/><line x1="460" y1="265" x2="460" y2="315" stroke="#a62b2b" stroke-width="4"/><text x="450" y="450" font-size="18" text-anchor="middle" fill="#172b45">Marcador hipotético (unidades relativas)</text><text x="40" y="482" font-size="15" text-anchor="start" fill="#172b45">Dados hipotéticos • modelo didático • sem limite legal • figura autoral</text></g></svg>