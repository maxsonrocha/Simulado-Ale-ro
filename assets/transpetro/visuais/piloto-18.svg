<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="title desc"><title id="title">Alarmes: troca entre dois tipos de erro</title><desc id="desc">No mesmo conjunto de casos, limiares 10,20,30 geram respectivamente falsos alarmes 12,5,2 e omissões 1,3,6. Custo interno por falso alarme 1 e por omissão 4.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#243b55"/></marker></defs><rect width="900" height="500" fill="white"/><text x="40" y="38" font-size="23" text-anchor="start" fill="#172b45">Alarmes: troca entre dois tipos de erro</text><g font-family="Arial, sans-serif"><rect x="60.0" y="100" width="260.0" height="48" fill="#dce9fb" stroke="#244e87" stroke-width="2"/><text x="190.0" y="130" font-size="17" text-anchor="middle" fill="#172b45">Limiar</text><rect x="320.0" y="100" width="260.0" height="48" fill="#dce9fb" stroke="#244e87" stroke-width="2"/><text x="450.0" y="130" font-size="17" text-anchor="middle" fill="#172b45">Falsos alarmes</text><rect x="580.0" y="100" width="260.0" height="48" fill="#dce9fb" stroke="#244e87" stroke-width="2"/><text x="710.0" y="130" font-size="17" text-anchor="middle" fill="#172b45">Omissões</text><rect x="60.0" y="148" width="260.0" height="48" fill="#fff" stroke="#244e87" stroke-width="2"/><text x="190.0" y="178" font-size="17" text-anchor="middle" fill="#172b45">10</text><rect x="320.0" y="148" width="260.0" height="48" fill="#fff" stroke="#244e87" stroke-width="2"/><text x="450.0" y="178" font-size="17" text-anchor="middle" fill="#172b45">12</text><rect x="580.0" y="148" width="260.0" height="48" fill="#fff" stroke="#244e87" stroke-width="2"/><text x="710.0" y="178" font-size="17" text-anchor="middle" fill="#172b45">1</text><rect x="60.0" y="196" width="260.0" height="48" fill="#fff" stroke="#244e87" stroke-width="2"/><text x="190.0" y="226" font-size="17" text-anchor="middle" fill="#172b45">20</text><rect x="320.0" y="196" width="260.0" height="48" fill="#fff" stroke="#244e87" stroke-width="2"/><text x="450.0" y="226" font-size="17" text-anchor="middle" fill="#172b45">5</text><rect x="580.0" y="196" width="260.0" height="48" fill="#fff" stroke="#244e87" stroke-width="2"/><text x="710.0" y="226" font-size="17" text-anchor="middle" fill="#172b45">3</text><rect x="60.0" y="244" width="260.0" height="48" fill="#fff" stroke="#244e87" stroke-width="2"/><text x="190.0" y="274" font-size="17" text-anchor="middle" fill="#172b45">30</text><rect x="320.0" y="244" width="260.0" height="48" fill="#fff" stroke="#244e87" stroke-width="2"/><text x="450.0" y="274" font-size="17" text-anchor="middle" fill="#172b45">2</text><rect x="580.0" y="244" width="260.0" height="48" fill="#fff" stroke="#244e87" stroke-width="2"/><text x="710.0" y="274" font-size="17" text-anchor="middle" fill="#172b45">6</text><text x="80" y="355" font-size="20" text-anchor="start" fill="#172b45">Custo interno: falso alarme 1; omissão 4.</text><text x="80" y="395" font-size="17" text-anchor="start" fill="#172b45">Mesmo conjunto de casos e mesmo peso por tipo de erro.</text><text x="40" y="482" font-size="15" text-anchor="start" fill="#172b45">Dados hipotéticos • modelo didático • sem limite legal • figura autoral</text></g></svg>