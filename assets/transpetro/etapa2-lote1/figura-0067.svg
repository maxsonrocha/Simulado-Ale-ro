<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">Perdas por alternativa e estado</title><desc id="desc">Perdas: X em S1=2 e S2=9; Y=5 e6; Z=8 e3. Sem probabilidades. Arrependimento=perda menos melhor perda no mesmo estado.</desc><rect width="960" height="620" fill="white"/><g font-family="Arial,sans-serif" fill="#152d45"><text x="35" y="38" font-size="24">Perdas por alternativa e estado</text><rect x="35.0" y="90" width="293.3333333333333" height="65" fill="#dbeaff" stroke="#204f80" stroke-width="3"/><text x="47.0" y="125" font-size="22">Alternativa</text><rect x="328.3333333333333" y="90" width="293.3333333333333" height="65" fill="#dbeaff" stroke="#204f80" stroke-width="3"/><text x="340.3333333333333" y="125" font-size="22">S1</text><rect x="621.6666666666666" y="90" width="293.3333333333333" height="65" fill="#dbeaff" stroke="#204f80" stroke-width="3"/><text x="633.6666666666666" y="125" font-size="22">S2</text><rect x="35.0" y="155" width="293.3333333333333" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="47.0" y="190" font-size="22">X</text><rect x="328.3333333333333" y="155" width="293.3333333333333" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="340.3333333333333" y="190" font-size="22">2</text><rect x="621.6666666666666" y="155" width="293.3333333333333" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="633.6666666666666" y="190" font-size="22">9</text><rect x="35.0" y="220" width="293.3333333333333" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="47.0" y="255" font-size="22">Y</text><rect x="328.3333333333333" y="220" width="293.3333333333333" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="340.3333333333333" y="255" font-size="22">5</text><rect x="621.6666666666666" y="220" width="293.3333333333333" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="633.6666666666666" y="255" font-size="22">6</text><rect x="35.0" y="285" width="293.3333333333333" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="47.0" y="320" font-size="22">Z</text><rect x="328.3333333333333" y="285" width="293.3333333333333" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="340.3333333333333" y="320" font-size="22">8</text><rect x="621.6666666666666" y="285" width="293.3333333333333" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="633.6666666666666" y="320" font-size="22">3</text><text x="30" y="596" font-size="16">Figura autoral • dados hipotéticos • sem limites legais • cotas e rótulos prevalecem</text></g></svg>