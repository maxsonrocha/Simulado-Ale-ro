<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">Barreiras e fator de degradação</title><desc id="desc">Ameaça passa por B1 antes do evento central; B2 limita dano depois. E degrada B1. Controle C age sobre E. Não há informação de independência probabilística.</desc><rect width="960" height="620" fill="white"/><g font-family="Arial,sans-serif" fill="#152d45"><text x="35" y="38" font-size="24">Barreiras e fator de degradação</text><line x1="200" y1="188" x2="355" y2="188" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><text x="277.5" y="178.0" font-size="16">B1</text><line x1="510" y1="188" x2="700" y2="188" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><text x="605.0" y="178.0" font-size="16">B2</text><line x1="510" y1="358" x2="355" y2="188" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><text x="432.5" y="263.0" font-size="16">degrada B1</text><rect x="45" y="160" width="155" height="60" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="57" y="195" font-size="22">Ameaça</text><rect x="355" y="160" width="155" height="60" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="367" y="195" font-size="22">Evento central</text><rect x="700" y="160" width="155" height="60" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="712" y="195" font-size="22">Dano</text><rect x="355" y="330" width="155" height="60" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="367" y="365" font-size="22">Fator E</text><text x="35" y="470" font-size="20">B1 evita perda de contenção; B2 limita o dano após a perda.</text><text x="35" y="502" font-size="20">Fator E reduz a eficácia de B1; controle C atua sobre E.</text><text x="30" y="596" font-size="16">Figura autoral • dados hipotéticos • sem limites legais • cotas e rótulos prevalecem</text></g></svg>