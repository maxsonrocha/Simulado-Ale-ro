<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">Cronograma de atividades incompatíveis</title><desc id="desc">Tarefa A de purga ocorre em [0,5) minutos; tarefa B com fonte de ignição em [4,9). Regra interna proíbe coexistência das tarefas.</desc><rect width="960" height="620" fill="white"/><g font-family="Arial,sans-serif" fill="#152d45"><text x="35" y="38" font-size="24">Cronograma de atividades incompatíveis</text><text x="40" y="105" font-size="20">Escala horizontal: minutos desde o início</text><line x1="160" y1="420" x2="830" y2="420" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><text x="160" y="450" font-size="18">0</text><text x="220" y="450" font-size="18">1</text><text x="280" y="450" font-size="18">2</text><text x="340" y="450" font-size="18">3</text><text x="400" y="450" font-size="18">4</text><text x="460" y="450" font-size="18">5</text><text x="520" y="450" font-size="18">6</text><text x="580" y="450" font-size="18">7</text><text x="640" y="450" font-size="18">8</text><text x="700" y="450" font-size="18">9</text><text x="760" y="450" font-size="18">10</text><text x="30" y="220" font-size="22">A</text><rect x="160" y="180" width="300" height="60" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="172" y="215" font-size="22">0 a 5: purga</text><text x="30" y="330" font-size="22">B</text><rect x="400" y="290" width="300" height="60" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="412" y="325" font-size="22">4 a 9: ignição</text><text x="40" y="510" font-size="20">Regra interna: purga A e fonte de ignição B não podem coexistir.</text><text x="30" y="596" font-size="16">Figura autoral • dados hipotéticos • sem limites legais • cotas e rótulos prevalecem</text></g></svg>