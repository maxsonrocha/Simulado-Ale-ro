<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">Equilíbrio de duas pernas simétricas</title><desc id="desc">Duas pernas simétricas sustentam peso de 1.000 N. Cada perna faz 30° com a horizontal. Modelo 2 T sen(30°)=Peso; sen(30°)=0,5.</desc><rect width="960" height="620" fill="white"/><g font-family="Arial,sans-serif" fill="#152d45"><text x="35" y="38" font-size="24">Equilíbrio de duas pernas simétricas</text><line x1="180" y1="130" x2="760" y2="130" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><line x1="470" y1="296" x2="182" y2="130" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><line x1="470" y1="296" x2="758" y2="130" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><rect x="360" y="296" width="220" height="75" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="372" y="331" font-size="22">Peso: 1.000 N</text><text x="80" y="495" font-size="20">Cada perna faz 30° com a horizontal. Tensões iguais.</text><text x="80" y="530" font-size="20">Equilíbrio: 2 T sen(30°)=Peso; sen(30°)=0,5.</text><text x="30" y="596" font-size="16">Figura autoral • dados hipotéticos • sem limites legais • cotas e rótulos prevalecem</text></g></svg>