xt x="777.0" y="272.0" font-size="17">10</text><polyline points="120.0,160.0 770.0,280.0" fill="none" stroke="#205a99" stroke-width="3"/><text x="160" y="540" font-size="18">20 ensaios em cada condição</text><text x="30" y="596" font-size="16">Figura autoral • dados hipotéticos • sem limites legais • cotas e rótulos prevalecem</text></g></svg>