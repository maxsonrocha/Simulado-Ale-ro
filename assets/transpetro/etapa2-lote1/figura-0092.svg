<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">Transporte sob viga</title><desc id="desc">Viga com vão vertical 3,10 m. Topo estático da carga em 3,00 m; oscilação pode elevar o topo em 0,15 m. Referência comum: piso nivelado.</desc><rect width="960" height="620" fill="white"/><g font-family="Arial,sans-serif" fill="#152d45"><text x="35" y="38" font-size="24">Transporte sob viga</text><rect x="90" y="140" width="730" height="40" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="102" y="175" font-size="22">Viga fixa</text><rect x="220" y="340" width="240" height="100" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="232" y="375" font-size="22">Veículo</text><circle cx="260" cy="460" r="26" fill="#293d51"/><circle cx="420" cy="460" r="26" fill="#293d51"/><rect x="470" y="190" width="110" height="230" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="482" y="225" font-size="22">Carga</text><line x1="460" y1="420" x2="590" y2="420" stroke="#243c56" stroke-width="7" stroke-dasharray=""/><line x1="470" y1="175" x2="580" y2="175" stroke="#b3412b" stroke-width="3" stroke-dasharray="5 4"/><line x1="90" y1="490" x2="860" y2="490" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><circle cx="720" cy="300" r="17" fill="#e7ae77"/><line x1="720" y1="317" x2="720" y2="380" stroke="#243c56" stroke-width="12" stroke-dasharray=""/><line x1="720" y1="340" x2="692" y2="365" stroke="#243c56" stroke-width="8" stroke-dasharray=""/><line x1="720" y1="340" x2="748" y2="365" stroke="#243c56" stroke-width="8" stroke-dasharray=""/><line x1="720" y1="380" x2="695" y2="425" stroke="#243c56" stroke-width="9" stroke-dasharray=""/><line x1="720" y1="380" x2="745" y2="425" stroke="#243c56" stroke-width="9" stroke-dasharray=""/><text x="70" y="545" font-size="19">Vão livre 3,10 m; topo da carga 3,00 m; oscilação máxima +0,15 m.</text><text x="30" y="596" font-size="16">Figura autoral • dados hipotéticos • sem limites legais • cotas e rótulos prevalecem</text></g></svg>