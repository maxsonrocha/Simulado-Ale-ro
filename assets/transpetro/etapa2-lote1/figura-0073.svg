<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">Modelo de repetição até correção</title><desc id="desc">Após cada evento, probabilidade de correção definitiva=0,25, independente entre tentativas. Caso contrário o processo se repete. Regra: E(N)=1/p, incluindo o evento que leva à correção.</desc><rect width="960" height="620" fill="white"/><g font-family="Arial,sans-serif" fill="#152d45"><text x="35" y="38" font-size="24">Modelo de repetição até correção</text><rect x="35.0" y="90" width="440.0" height="65" fill="#dbeaff" stroke="#204f80" stroke-width="3"/><text x="47.0" y="125" font-size="22">Parâmetro</text><rect x="475.0" y="90" width="440.0" height="65" fill="#dbeaff" stroke="#204f80" stroke-width="3"/><text x="487.0" y="125" font-size="22">Valor</text><rect x="35.0" y="155" width="440.0" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="47.0" y="190" font-size="22">p de correção</text><rect x="475.0" y="155" width="440.0" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="487.0" y="190" font-size="22">0,25</text><rect x="35.0" y="220" width="440.0" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="47.0" y="255" font-size="22">Modelo</text><rect x="475.0" y="220" width="440.0" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="487.0" y="255" font-size="22">E(N)=1/p</text><text x="30" y="596" font-size="16">Figura autoral • dados hipotéticos • sem limites legais • cotas e rótulos prevalecem</text></g></svg>