<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">Secagem de resíduo sem perda de sólidos</title><desc id="desc">Massa inicial 100 kg; umidade inicial 20% da massa úmida; umidade final desejada 5% da massa úmida; sólidos secos conservados.</desc><rect width="960" height="620" fill="white"/><g font-family="Arial,sans-serif" fill="#152d45"><text x="35" y="38" font-size="24">Secagem de resíduo sem perda de sólidos</text><rect x="35.0" y="90" width="440.0" height="65" fill="#dbeaff" stroke="#204f80" stroke-width="3"/><text x="47.0" y="125" font-size="22">Condição</text><rect x="475.0" y="90" width="440.0" height="65" fill="#dbeaff" stroke="#204f80" stroke-width="3"/><text x="487.0" y="125" font-size="22">Valor</text><rect x="35.0" y="155" width="440.0" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="47.0" y="190" font-size="22">Massa inicial</text><rect x="475.0" y="155" width="440.0" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="487.0" y="190" font-size="22">100 kg</text><rect x="35.0" y="220" width="440.0" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="47.0" y="255" font-size="22">Umidade inicial</text><rect x="475.0" y="220" width="440.0" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="487.0" y="255" font-size="22">20% base úmida</text><rect x="35.0" y="285" width="440.0" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="47.0" y="320" font-size="22">Umidade final</text><rect x="475.0" y="285" width="440.0" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="487.0" y="320" font-size="22">5% base úmida</text><text x="30" y="596" font-size="16">Figura autoral • dados hipotéticos • sem limites legais • cotas e rótulos prevalecem</text></g></svg>