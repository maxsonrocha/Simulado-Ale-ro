<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">Esquema de sustentação por cabos ideais</title><desc id="desc">Carga móvel total de 800 N sustentada por quatro segmentos verticais ideais, com tensão igual. Sem atrito ou massa adicional; equilíbrio estático.</desc><rect width="960" height="620" fill="white"/><g font-family="Arial,sans-serif" fill="#152d45"><text x="35" y="38" font-size="24">Esquema de sustentação por cabos ideais</text><rect x="120" y="110" width="620" height="35" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="132" y="145" font-size="22">Suporte ideal</text><line x1="220" y1="145" x2="220" y2="360" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><line x1="320" y1="145" x2="320" y2="360" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><line x1="520" y1="145" x2="520" y2="360" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><line x1="620" y1="145" x2="620" y2="360" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><rect x="190" y="360" width="460" height="70" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="202" y="395" font-size="22">Conjunto móvel: peso total 800 N</text><text x="40" y="500" font-size="20">Quatro segmentos verticais sustentam a carga, tensão igual em todos.</text><text x="40" y="535" font-size="20">Equilíbrio ideal; sem atrito e sem massa adicional.</text><text x="30" y="596" font-size="16">Figura autoral • dados hipotéticos • sem limites legais • cotas e rótulos prevalecem</text></g></svg>