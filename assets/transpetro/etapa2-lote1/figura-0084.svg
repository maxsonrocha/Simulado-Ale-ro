<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">Modelo de lavagem em duas etapas</title><desc id="desc">Tanques A e B em série, cada um com 10 L e vazão de 2 L/min. Mistura perfeita. Tempo médio por tanque=V/q; tempos médios se somam.</desc><rect width="960" height="620" fill="white"/><g font-family="Arial,sans-serif" fill="#152d45"><text x="35" y="38" font-size="24">Modelo de lavagem em duas etapas</text><line x1="195" y1="198" x2="400" y2="198" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><text x="297.5" y="188.0" font-size="16">q</text><line x1="555" y1="198" x2="730" y2="198" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><text x="642.5" y="188.0" font-size="16">q</text><rect x="40" y="170" width="155" height="60" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="52" y="205" font-size="22">Tanque A</text><rect x="400" y="170" width="155" height="60" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="412" y="205" font-size="22">Tanque B</text><rect x="730" y="170" width="155" height="60" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="742" y="205" font-size="22">Saída</text><text x="35" y="470" font-size="20">Cada tanque: mistura perfeita, volume 10 L e vazão 2 L/min.</text><text x="35" y="502" font-size="20">Tempo médio de residência por tanque=V/q.</text><text x="35" y="534" font-size="20">Para o conjunto em série, tempos médios se somam.</text><text x="30" y="596" font-size="16">Figura autoral • dados hipotéticos • sem limites legais • cotas e rótulos prevalecem</text></g></svg>