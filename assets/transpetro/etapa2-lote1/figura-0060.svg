<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">Componentes de aceleração no exercício</title><desc id="desc">Componentes já ponderadas: x=0,6, y=0,8, z=0 m/s². Regra do exercício: resultante raiz da soma dos quadrados.</desc><rect width="960" height="620" fill="white"/><g font-family="Arial,sans-serif" fill="#152d45"><text x="35" y="38" font-size="24">Componentes de aceleração no exercício</text><rect x="35.0" y="90" width="440.0" height="65" fill="#dbeaff" stroke="#204f80" stroke-width="3"/><text x="47.0" y="125" font-size="22">Componente</text><rect x="475.0" y="90" width="440.0" height="65" fill="#dbeaff" stroke="#204f80" stroke-width="3"/><text x="487.0" y="125" font-size="22">Valor (m/s²)</text><rect x="35.0" y="155" width="440.0" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="47.0" y="190" font-size="22">x</text><rect x="475.0" y="155" width="440.0" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="487.0" y="190" font-size="22">0,6</text><rect x="35.0" y="220" width="440.0" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="47.0" y="255" font-size="22">y</text><rect x="475.0" y="220" width="440.0" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="487.0" y="255" font-size="22">0,8</text><rect x="35.0" y="285" width="440.0" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="47.0" y="320" font-size="22">z</text><rect x="475.0" y="285" width="440.0" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="487.0" y="320" font-size="22">0</text><text x="30" y="596" font-size="16">Figura autoral • dados hipotéticos • sem limites legais • cotas e rótulos prevalecem</text></g></svg>