e="#204f80" stroke-width="3"/><text x="633.6666666666666" y="255" font-size="22">0,5</text><rect x="35.0" y="285" width="293.3333333333333" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="47.0" y="320" font-size="22">R</text><rect x="328.3333333333333" y="285" width="293.3333333333333" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="340.3333333333333" y="320" font-size="22">30</text><rect x="621.6666666666666" y="285" width="293.3333333333333" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="633.6666666666666" y="320" font-size="22">0,1</text><text x="30" y="596" font-size="16">Figura autoral • dados hipotéticos • sem limites legais • cotas e rótulos prevalecem</text></g></svg>