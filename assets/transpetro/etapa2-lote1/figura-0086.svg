<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">Estados de um comando didático</title><desc id="desc">PARADO passa a PRONTO após Reset; PRONTO passa a OPERANDO após Partida. Partida em PARADO é ignorada. Estado inicial PARADO; comandos: Partida, depois Reset.</desc><rect width="960" height="620" fill="white"/><g font-family="Arial,sans-serif" fill="#152d45"><text x="35" y="38" font-size="24">Estados de um comando didático</text><line x1="190" y1="208" x2="350" y2="208" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><text x="270.0" y="198.0" font-size="16">Reset</text><line x1="505" y1="208" x2="690" y2="208" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><text x="597.5" y="198.0" font-size="16">Partida</text><rect x="35" y="180" width="155" height="60" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="47" y="215" font-size="22">PARADO</text><rect x="350" y="180" width="155" height="60" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="362" y="215" font-size="22">PRONTO</text><rect x="690" y="180" width="155" height="60" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="702" y="215" font-size="22">OPERANDO</text><text x="35" y="470" font-size="20">Reset só arma; não inicia movimento.</text><text x="35" y="502" font-size="20">Partida só opera a partir de PRONTO.</text><text x="35" y="534" font-size="20">Estado inicial PARADO; sequência recebida: Partida, Reset.</text><text x="30" y="596" font-size="16">Figura autoral • dados hipotéticos • sem limites legais • cotas e rótulos prevalecem</text></g></svg>