<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">Tubo apoiado com centro de gravidade excêntrico</title><desc id="desc">Tubo com apoios A em x=0 m e B em x=4 m; peso total de 600 N aplicado em x=3 m. Equilíbrio: RA+RB=P e RB vezes 4=P vezes 3.</desc><rect width="960" height="620" fill="white"/><g font-family="Arial,sans-serif" fill="#152d45"><text x="35" y="38" font-size="24">Tubo apoiado com centro de gravidade excêntrico</text><line x1="100" y1="230" x2="800" y2="230" stroke="#475e75" stroke-width="35" stroke-dasharray=""/><path d="M180 450 L250 247 L320 450 Z" fill="#e8b361"/><path d="M590 450 L660 247 L730 450 Z" fill="#e8b361"/><line x1="100" y1="450" x2="840" y2="450" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><line x1="558" y1="125" x2="558" y2="230" stroke="#b3412b" stroke-width="5" stroke-dasharray=""/><text x="490" y="100" font-size="22">Peso 600 N</text><text x="140" y="500" font-size="21">A em x=0 m; B em x=4 m; peso em x=3 m.</text><text x="140" y="540" font-size="21">Equilíbrio: RA+RB=P; RB·4=P·3.</text><text x="30" y="596" font-size="16">Figura autoral • dados hipotéticos • sem limites legais • cotas e rótulos prevalecem</text></g></svg>