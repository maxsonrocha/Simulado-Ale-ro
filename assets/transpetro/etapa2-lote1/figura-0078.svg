<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">Circuito de ensaio de continuidade funcional</title><desc id="desc">Fonte ideal de 24 V alimenta resistores em paralelo: R1=6 Ω e R2=3 Ω. Condutores ideais; I=V/R.</desc><rect width="960" height="620" fill="white"/><g font-family="Arial,sans-serif" fill="#152d45"><text x="35" y="38" font-size="24">Circuito de ensaio de continuidade funcional</text><rect x="70" y="210" width="130" height="80" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="82" y="245" font-size="22">Fonte 24 V</text><line x1="200" y1="250" x2="350" y2="250" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><line x1="350" y1="130" x2="350" y2="370" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><rect x="430" y="100" width="170" height="65" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="442" y="135" font-size="22">R1=6 Ω</text><rect x="430" y="340" width="170" height="65" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="442" y="375" font-size="22">R2=3 Ω</text><line x1="350" y1="130" x2="430" y2="130" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><line x1="350" y1="370" x2="430" y2="370" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><line x1="600" y1="130" x2="730" y2="130" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><line x1="600" y1="370" x2="730" y2="370" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><line x1="730" y1="130" x2="730" y2="370" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><line x1="730" y1="250" x2="850" y2="250" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><line x1="850" y1="250" x2="850" y2="445" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><line x1="850" y1="445" x2="135" y2="445" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><line x1="135" y1="445" x2="135" y2="290" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><text x="55" y="475" font-size="20">Ramos em paralelo, condutores ideais. I=V/R.</text><text x="30" y="596" font-size="16">Figura autoral • dados hipotéticos • sem limites legais • cotas e rótulos prevalecem</text></g></svg>