<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">Probabilidades e códigos de cenários</title><desc id="desc">Cenários A,B,C,D têm probabilidades 0,5; 0,25; 0,125; 0,125. Código prefixo: A=0,B=10,C=110,D=111. Comprimentos1,2,3,3 bits.</desc><rect width="960" height="620" fill="white"/><g font-family="Arial,sans-serif" fill="#152d45"><text x="35" y="38" font-size="24">Probabilidades e códigos de cenários</text><rect x="35.0" y="90" width="293.3333333333333" height="65" fill="#dbeaff" stroke="#204f80" stroke-width="3"/><text x="47.0" y="125" font-size="22">Cenário</text><rect x="328.3333333333333" y="90" width="293.3333333333333" height="65" fill="#dbeaff" stroke="#204f80" stroke-width="3"/><text x="340.3333333333333" y="125" font-size="22">Probabilidade</text><rect x="621.6666666666666" y="90" width="293.3333333333333" height="65" fill="#dbeaff" stroke="#204f80" stroke-width="3"/><text x="633.6666666666666" y="125" font-size="22">Código</text><rect x="35.0" y="155" width="293.3333333333333" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="47.0" y="190" font-size="22">A</text><rect x="328.3333333333333" y="155" width="293.3333333333333" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="340.3333333333333" y="190" font-size="22">0,5</text><rect x="621.6666666666666" y="155" width="293.3333333333333" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="633.6666666666666" y="190" font-size="22">0</text><rect x="35.0" y="220" width="293.3333333333333" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="47.0" y="255" font-size="22">B</text><rect x="328.3333333333333" y="220" width="293.3333333333333" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="340.3333333333333" y="255" font-size="22">0,25</text><rect x="621.6666666666666" y="220" width="293.3333333333333" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="633.6666666666666" y="255" font-size="22">10</text><rect x="35.0" y="285" width="293.3333333333333" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="47.0" y="320" font-size="22">C</text><rect x="328.3333333333333" y="285" width="293.3333333333333" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="340.3333333333333" y="320" font-size="22">0,125</text><rect x="621.6666666666666" y="285" width="293.3333333333333" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="633.6666666666666" y="320" font-size="22">110</text><rect x="35.0" y="350" width="293.3333333333333" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="47.0" y="385" font-size="22">D</text><rect x="328.3333333333333" y="350" width="293.3333333333333" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="340.3333333333333" y="385" font-size="22">0,125</text><rect x="621.6666666666666" y="350" width="293.3333333333333" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="633.6666666666666" y="385" font-size="22">111</text><text x="30" y="596" font-size="16">Figura autoral • dados hipotéticos • sem limites legais • cotas e rótulos prevalecem</text></g></svg>