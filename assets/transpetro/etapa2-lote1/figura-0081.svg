<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">Árvore lógica de discordância de canais</title><desc id="desc">Evento T é OU exclusivo de A e B independentes, com probabilidades 0,2 e 0,3. T=1 somente quando exatamente um canal sinaliza.</desc><rect width="960" height="620" fill="white"/><g font-family="Arial,sans-serif" fill="#152d45"><text x="35" y="38" font-size="24">Árvore lógica de discordância de canais</text><line x1="200" y1="148" x2="350" y2="228" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><text x="275.0" y="178.0" font-size="16"></text><line x1="200" y1="318" x2="350" y2="228" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><text x="275.0" y="263.0" font-size="16"></text><line x1="505" y1="228" x2="680" y2="228" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><text x="592.5" y="218.0" font-size="16"></text><rect x="45" y="120" width="155" height="60" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="57" y="155" font-size="22">A</text><rect x="45" y="290" width="155" height="60" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="57" y="325" font-size="22">B</text><rect x="350" y="200" width="155" height="60" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="362" y="235" font-size="22">OU exclusivo</text><rect x="680" y="200" width="155" height="60" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="692" y="235" font-size="22">T</text><text x="35" y="470" font-size="20">T=1 somente quando exatamente um entre A e B é 1.</text><text x="35" y="502" font-size="20">A e B independentes; P(A)=0,2; P(B)=0,3.</text><text x="30" y="596" font-size="16">Figura autoral • dados hipotéticos • sem limites legais • cotas e rótulos prevalecem</text></g></svg>