<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">Peça em queda sobre superfície inclinada</title><desc id="desc">Trajetória da peça: x=2 t e y=5−5 t². Superfície inclinada: y=3−x. Metros e segundos; início em t=0. Primeiro contato com plano para t positivo; cotas e equações prevalecem.</desc><rect width="960" height="620" fill="white"/><g font-family="Arial,sans-serif" fill="#152d45"><text x="35" y="38" font-size="24">Peça em queda sobre superfície inclinada</text><rect x="100" y="205" width="200" height="40" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="112" y="240" font-size="22">Plataforma</text><circle cx="190" cy="80" r="17" fill="#e7ae77"/><line x1="190" y1="97" x2="190" y2="160" stroke="#243c56" stroke-width="12" stroke-dasharray=""/><line x1="190" y1="120" x2="162" y2="145" stroke="#243c56" stroke-width="8" stroke-dasharray=""/><line x1="190" y1="120" x2="218" y2="145" stroke="#243c56" stroke-width="8" stroke-dasharray=""/><line x1="190" y1="160" x2="165" y2="205" stroke="#243c56" stroke-width="9" stroke-dasharray=""/><line x1="190" y1="160" x2="215" y2="205" stroke="#243c56" stroke-width="9" stroke-dasharray=""/><line x1="300" y1="270" x2="850" y2="490" stroke="#4b617a" stroke-width="7" stroke-dasharray=""/><path d="M300 205 Q450 210 560 374" fill="none" stroke="#ba492e" stroke-width="4"/><text x="510" y="130" font-size="21">Peça: x=2 t; y=5−5 t²</text><text x="510" y="180" font-size="21">Plano inclinado: y=3−x</text><text x="510" y="230" font-size="19">x,y em m; t em s; início t=0</text><text x="60" y="510" font-size="19">Origem no piso; prevalecem equações e cotas, não o desenho.</text><text x="60" y="545" font-size="19">Primeiro contato com plano: igualar alturas; t deve ser positivo.</text><text x="30" y="596" font-size="16">Figura autoral • dados hipotéticos • sem limites legais • cotas e rótulos prevalecem</text></g></svg>