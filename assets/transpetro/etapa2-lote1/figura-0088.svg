<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">Rede de tempos de deslocamento</title><desc id="desc">Base até A: 4 min; A até alvo: 2 min. Base até B: 2 min; B até alvo: 7 min. Apenas essas rotas são permitidas.</desc><rect width="960" height="620" fill="white"/><g font-family="Arial,sans-serif" fill="#152d45"><text x="35" y="38" font-size="24">Rede de tempos de deslocamento</text><line x1="190" y1="258" x2="350" y2="138" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><text x="270.0" y="188.0" font-size="16">4 min</text><line x1="190" y1="258" x2="350" y2="358" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><text x="270.0" y="298.0" font-size="16">2 min</text><line x1="505" y1="138" x2="710" y2="258" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><text x="607.5" y="188.0" font-size="16">2 min</text><line x1="505" y1="358" x2="710" y2="258" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><text x="607.5" y="298.0" font-size="16">7 min</text><rect x="35" y="230" width="155" height="60" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="47" y="265" font-size="22">Base</text><rect x="350" y="110" width="155" height="60" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="362" y="145" font-size="22">A</text><rect x="350" y="330" width="155" height="60" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="362" y="365" font-size="22">B</text><rect x="710" y="230" width="155" height="60" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="722" y="265" font-size="22">Alvo</text><text x="35" y="470" font-size="20">Apenas os caminhos desenhados são permitidos.</text><text x="35" y="502" font-size="20">Saída simultânea possível; tempos incluem toda a travessia.</text><text x="30" y="596" font-size="16">Figura autoral • dados hipotéticos • sem limites legais • cotas e rótulos prevalecem</text></g></svg>