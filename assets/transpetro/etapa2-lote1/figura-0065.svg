<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">Incertezas e correlação no modelo</title><desc id="desc">Incertezas padrão u1=3 e u2=4 unidades, correlação r=1. Para soma: u²=u1²+u2²+2 ru1 u2.</desc><rect width="960" height="620" fill="white"/><g font-family="Arial,sans-serif" fill="#152d45"><text x="35" y="38" font-size="24">Incertezas e correlação no modelo</text><rect x="35.0" y="90" width="440.0" height="65" fill="#dbeaff" stroke="#204f80" stroke-width="3"/><text x="47.0" y="125" font-size="22">Parâmetro</text><rect x="475.0" y="90" width="440.0" height="65" fill="#dbeaff" stroke="#204f80" stroke-width="3"/><text x="487.0" y="125" font-size="22">Valor</text><rect x="35.0" y="155" width="440.0" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="47.0" y="190" font-size="22">u1</text><rect x="475.0" y="155" width="440.0" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="487.0" y="190" font-size="22">3</text><rect x="35.0" y="220" width="440.0" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="47.0" y="255" font-size="22">u2</text><rect x="475.0" y="220" width="440.0" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="487.0" y="255" font-size="22">4</text><rect x="35.0" y="285" width="440.0" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="47.0" y="320" font-size="22">r</text><rect x="475.0" y="285" width="440.0" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="487.0" y="320" font-size="22">1</text><text x="30" y="596" font-size="16">Figura autoral • dados hipotéticos • sem limites legais • cotas e rótulos prevalecem</text></g></svg>