<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">Lógica de um permissivo didático</title><desc id="desc">Liberação=A E NÃO B. A confirma imobilidade; B indica porta aberta. Estado mostrado: A=1 e B=1.</desc><rect width="960" height="620" fill="white"/><g font-family="Arial,sans-serif" fill="#152d45"><text x="35" y="38" font-size="24">Lógica de um permissivo didático</text><line x1="205" y1="158" x2="340" y2="218" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><text x="272.5" y="178.0" font-size="16"></text><line x1="205" y1="298" x2="340" y2="218" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><text x="272.5" y="248.0" font-size="16"></text><line x1="495" y1="218" x2="680" y2="218" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><text x="587.5" y="208.0" font-size="16"></text><rect x="50" y="130" width="155" height="60" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="62" y="165" font-size="22">A</text><rect x="340" y="190" width="155" height="60" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="352" y="225" font-size="22">E lógico</text><rect x="50" y="270" width="155" height="60" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="62" y="305" font-size="22">NÃO B</text><rect x="680" y="190" width="155" height="60" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="692" y="225" font-size="22">LIBERAR</text><text x="35" y="470" font-size="20">A=confirmação de imobilidade; B=porta aberta</text><text x="35" y="502" font-size="20">Regra interna: LIBERAR = A E NÃO B</text><text x="35" y="534" font-size="20">Estado mostrado: A=1; B=1</text><text x="30" y="596" font-size="16">Figura autoral • dados hipotéticos • sem limites legais • cotas e rótulos prevalecem</text></g></svg>