<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">Amostragem de atmosfera estratificada</title><desc id="desc">Tanque estratificado, sem mistura. Agente X concentrado na camada inferior. Sonda de amostragem alcança somente o topo, fora dessa camada.</desc><rect width="960" height="620" fill="white"/><g font-family="Arial,sans-serif" fill="#152d45"><text x="35" y="38" font-size="24">Amostragem de atmosfera estratificada</text><rect x="160" y="130" width="330" height="340" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="172" y="165" font-size="22">Tanque</text><rect x="165" y="350" width="320" height="115" fill="#f8d8b8" stroke="#204f80" stroke-width="3"/><text x="177" y="385" font-size="22">Camada inferior: agente X</text><circle cx="590" cy="150" r="17" fill="#e7ae77"/><line x1="590" y1="167" x2="590" y2="230" stroke="#243c56" stroke-width="12" stroke-dasharray=""/><line x1="590" y1="190" x2="562" y2="215" stroke="#243c56" stroke-width="8" stroke-dasharray=""/><line x1="590" y1="190" x2="618" y2="215" stroke="#243c56" stroke-width="8" stroke-dasharray=""/><line x1="590" y1="230" x2="565" y2="275" stroke="#243c56" stroke-width="9" stroke-dasharray=""/><line x1="590" y1="230" x2="615" y2="275" stroke="#243c56" stroke-width="9" stroke-dasharray=""/><line x1="590" y1="220" x2="365" y2="200" stroke="#319184" stroke-width="4" stroke-dasharray=""/><text x="525" y="360" font-size="23">Sonda só no topo</text><text x="525" y="410" font-size="20">X permanece estratificado</text><text x="525" y="450" font-size="20">Sem mistura no exercício</text><text x="30" y="596" font-size="16">Figura autoral • dados hipotéticos • sem limites legais • cotas e rótulos prevalecem</text></g></svg>