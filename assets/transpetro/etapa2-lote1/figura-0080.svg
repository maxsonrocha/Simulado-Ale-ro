<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">Topologia de isolamento de um trecho</title><desc id="desc">Reservatório ligado a P através de V aberta. D aberto deriva entre V e P e drena esse trecho. Não há outras fontes ou conexões no modelo.</desc><rect width="960" height="620" fill="white"/><g font-family="Arial,sans-serif" fill="#152d45"><text x="35" y="38" font-size="24">Topologia de isolamento de um trecho</text><line x1="195" y1="158" x2="340" y2="158" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><text x="267.5" y="148.0" font-size="16"></text><line x1="495" y1="158" x2="660" y2="158" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><text x="577.5" y="148.0" font-size="16"></text><line x1="495" y1="158" x2="340" y2="348" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><text x="417.5" y="243.0" font-size="16"></text><rect x="40" y="130" width="155" height="60" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="52" y="165" font-size="22">Reservatório</text><rect x="340" y="130" width="155" height="60" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="352" y="165" font-size="22">V aberta</text><rect x="660" y="130" width="155" height="60" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="672" y="165" font-size="22">Ponto P</text><rect x="340" y="320" width="155" height="60" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="352" y="355" font-size="22">D aberto</text><text x="35" y="470" font-size="20">V separa reservatório do trecho que contém P.</text><text x="35" y="502" font-size="20">D drena só esse trecho para recipiente externo.</text><text x="35" y="534" font-size="20">Modelo: não existem outras fontes ou conexões.</text><text x="30" y="596" font-size="16">Figura autoral • dados hipotéticos • sem limites legais • cotas e rótulos prevalecem</text></g></svg>