<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">Encontro de curva da rede e ventilador</title><desc id="desc">Curva do ventilador H=12−2 Q e da rede H=2 Q. Operação onde se igualam. H e Q em unidades internas coerentes; desenho qualitativo, equações prevalecem.</desc><rect width="960" height="620" fill="white"/><g font-family="Arial,sans-serif" fill="#152d45"><text x="35" y="38" font-size="24">Encontro de curva da rede e ventilador</text><line x1="110" y1="420" x2="790" y2="420" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><line x1="110" y1="90" x2="110" y2="420" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><line x1="110" y1="120" x2="730" y2="360" stroke="#214f80" stroke-width="5" stroke-dasharray=""/><line x1="110" y1="420" x2="730" y2="180" stroke="#ac452e" stroke-width="5" stroke-dasharray=""/><text x="130" y="95" font-size="19">H (unidades de pressão)</text><text x="550" y="460" font-size="19">Q (unidades de vazão)</text><text x="100" y="510" font-size="20">Curva do ventilador: H=12−2 Q; curva da rede: H=2 Q</text><text x="300" y="265" font-size="19">Interseção operacional</text><text x="30" y="596" font-size="16">Figura autoral • dados hipotéticos • sem limites legais • cotas e rótulos prevalecem</text></g></svg>