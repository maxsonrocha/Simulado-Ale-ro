<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">Arco de movimento em aperto manual</title><desc id="desc">Mão e ferramenta percorrem um arco. Envelope horizontal da mão avança até x=0,70 m; obstáculo fixo começa em x=0,65 m. Mesmo referencial; avanço aumenta x.</desc><rect width="960" height="620" fill="white"/><g font-family="Arial,sans-serif" fill="#152d45"><text x="35" y="38" font-size="24">Arco de movimento em aperto manual</text><rect x="150" y="250" width="420" height="90" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="162" y="285" font-size="22">Carcaça</text><line x1="430" y1="250" x2="600" y2="140" stroke="#996128" stroke-width="14" stroke-dasharray=""/><circle cx="690" cy="170" r="17" fill="#e7ae77"/><line x1="690" y1="187" x2="690" y2="250" stroke="#243c56" stroke-width="12" stroke-dasharray=""/><line x1="690" y1="210" x2="662" y2="235" stroke="#243c56" stroke-width="8" stroke-dasharray=""/><line x1="690" y1="210" x2="718" y2="235" stroke="#243c56" stroke-width="8" stroke-dasharray=""/><line x1="690" y1="250" x2="665" y2="295" stroke="#243c56" stroke-width="9" stroke-dasharray=""/><line x1="690" y1="250" x2="715" y2="295" stroke="#243c56" stroke-width="9" stroke-dasharray=""/><path d="M440 250 A200 200 0 0 1 610 350" stroke="#bd462d" stroke-width="4" fill="none"/><rect x="610" y="290" width="80" height="150" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="622" y="325" font-size="22">Obstáculo</text><text x="60" y="480" font-size="20">Envelope da mão até x=0,70 m; obstáculo começa em x=0,65 m.</text><text x="60" y="525" font-size="20">Mesmo referencial; avanço do movimento aumenta x.</text><text x="30" y="596" font-size="16">Figura autoral • dados hipotéticos • sem limites legais • cotas e rótulos prevalecem</text></g></svg>