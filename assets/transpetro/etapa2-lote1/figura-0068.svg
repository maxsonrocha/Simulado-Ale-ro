<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">Tempos de duas equipes para duas missões</title><desc id="desc">Tempos em min: equipe A para X=2,Y=3; equipe B para X=4,Y=10. Cada equipe executa exatamente uma missão; conclusão conjunta é o maior tempo.</desc><rect width="960" height="620" fill="white"/><g font-family="Arial,sans-serif" fill="#152d45"><text x="35" y="38" font-size="24">Tempos de duas equipes para duas missões</text><rect x="35.0" y="90" width="293.3333333333333" height="65" fill="#dbeaff" stroke="#204f80" stroke-width="3"/><text x="47.0" y="125" font-size="22">Equipe</text><rect x="328.3333333333333" y="90" width="293.3333333333333" height="65" fill="#dbeaff" stroke="#204f80" stroke-width="3"/><text x="340.3333333333333" y="125" font-size="22">Missão X</text><rect x="621.6666666666666" y="90" width="293.3333333333333" height="65" fill="#dbeaff" stroke="#204f80" stroke-width="3"/><text x="633.6666666666666" y="125" font-size="22">Missão Y</text><rect x="35.0" y="155" width="293.3333333333333" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="47.0" y="190" font-size="22">A</text><rect x="328.3333333333333" y="155" width="293.3333333333333" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="340.3333333333333" y="190" font-size="22">2</text><rect x="621.6666666666666" y="155" width="293.3333333333333" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="633.6666666666666" y="190" font-size="22">3</text><rect x="35.0" y="220" width="293.3333333333333" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="47.0" y="255" font-size="22">B</text><rect x="328.3333333333333" y="220" width="293.3333333333333" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="340.3333333333333" y="255" font-size="22">4</text><rect x="621.6666666666666" y="220" width="293.3333333333333" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="633.6666666666666" y="255" font-size="22">10</text><text x="30" y="596" font-size="16">Figura autoral • dados hipotéticos • sem limites legais • cotas e rótulos prevalecem</text></g></svg>