<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">Balanço de vazão em duas zonas</title><desc id="desc">Zona A recebe 10 m³/min e envia q a B. B também recebe 5 m³/min de fora e possui uma saída. Estacionário, incompressível, sem outras conexões.</desc><rect width="960" height="620" fill="white"/><g font-family="Arial,sans-serif" fill="#152d45"><text x="35" y="38" font-size="24">Balanço de vazão em duas zonas</text><rect x="120" y="170" width="230" height="170" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="132" y="205" font-size="22">Zona A</text><rect x="560" y="170" width="230" height="170" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="572" y="205" font-size="22">Zona B</text><line x1="20" y1="240" x2="120" y2="240" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><text x="25" y="215" font-size="18">10 m³/min</text><line x1="350" y1="240" x2="560" y2="240" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><text x="375" y="210" font-size="20">q ?</text><line x1="790" y1="240" x2="910" y2="240" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><text x="795" y="210" font-size="18">Saída ?</text><line x1="660" y1="80" x2="660" y2="170" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><text x="690" y="105" font-size="18">5 m³/min</text><text x="45" y="475" font-size="20">Regime estacionário, incompressível, sem acúmulo ou outras conexões.</text><text x="30" y="596" font-size="16">Figura autoral • dados hipotéticos • sem limites legais • cotas e rótulos prevalecem</text></g></svg>