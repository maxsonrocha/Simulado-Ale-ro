<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">Acesso de equipamento móvel de resposta</title><desc id="desc">Materiais estreitam a passagem a 0,55 m. Envelope do equipamento móvel: 0,70 m. Critério geométrico interno: passagem maior ou igual ao envelope, sem girar o equipamento.</desc><rect width="960" height="620" fill="white"/><g font-family="Arial,sans-serif" fill="#152d45"><text x="35" y="38" font-size="24">Acesso de equipamento móvel de resposta</text><rect x="90" y="130" width="90" height="340" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="102" y="165" font-size="22">Parede</text><rect x="650" y="130" width="90" height="340" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="662" y="165" font-size="22">Estante</text><rect x="190" y="300" width="430" height="100" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="202" y="335" font-size="22">Material temporário</text><circle cx="480" cy="150" r="17" fill="#e7ae77"/><line x1="480" y1="167" x2="480" y2="230" stroke="#243c56" stroke-width="12" stroke-dasharray=""/><line x1="480" y1="190" x2="452" y2="215" stroke="#243c56" stroke-width="8" stroke-dasharray=""/><line x1="480" y1="190" x2="508" y2="215" stroke="#243c56" stroke-width="8" stroke-dasharray=""/><line x1="480" y1="230" x2="455" y2="275" stroke="#243c56" stroke-width="9" stroke-dasharray=""/><line x1="480" y1="230" x2="505" y2="275" stroke="#243c56" stroke-width="9" stroke-dasharray=""/><text x="80" y="520" font-size="21">Passagem residual: 0,55 m; envelope de transporte: 0,70 m.</text><text x="80" y="555" font-size="19">Critério geométrico interno: passagem ≥ envelope.</text><text x="30" y="596" font-size="16">Figura autoral • dados hipotéticos • sem limites legais • cotas e rótulos prevalecem</text></g></svg>