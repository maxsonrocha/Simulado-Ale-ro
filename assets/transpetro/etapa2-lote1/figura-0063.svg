<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">Ordens por estrato e regra interna</title><desc id="desc">Estratos A,B,C com 50,30,20 ordens; amostra total 20; alocação proporcional, sem arredondamento necessário.</desc><rect width="960" height="620" fill="white"/><g font-family="Arial,sans-serif" fill="#152d45"><text x="35" y="38" font-size="24">Ordens por estrato e regra interna</text><rect x="35.0" y="90" width="440.0" height="65" fill="#dbeaff" stroke="#204f80" stroke-width="3"/><text x="47.0" y="125" font-size="22">Estrato</text><rect x="475.0" y="90" width="440.0" height="65" fill="#dbeaff" stroke="#204f80" stroke-width="3"/><text x="487.0" y="125" font-size="22">Ordens</text><rect x="35.0" y="155" width="440.0" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="47.0" y="190" font-size="22">A</text><rect x="475.0" y="155" width="440.0" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="487.0" y="190" font-size="22">50</text><rect x="35.0" y="220" width="440.0" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="47.0" y="255" font-size="22">B</text><rect x="475.0" y="220" width="440.0" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="487.0" y="255" font-size="22">30</text><rect x="35.0" y="285" width="440.0" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="47.0" y="320" font-size="22">C</text><rect x="475.0" y="285" width="440.0" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="487.0" y="320" font-size="22">20</text><text x="30" y="596" font-size="16">Figura autoral • dados hipotéticos • sem limites legais • cotas e rótulos prevalecem</text></g></svg>