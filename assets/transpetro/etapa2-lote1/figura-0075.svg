<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">Evidências por requisito</title><desc id="desc">Requisito R1 exige teste T1 e relatório L1. R2 exige T2 e L2. Disponíveis T1,L1,T2; ausente L2. Regra interna: requisito atendido somente com as duas evidências.</desc><rect width="960" height="620" fill="white"/><g font-family="Arial,sans-serif" fill="#152d45"><text x="35" y="38" font-size="24">Evidências por requisito</text><rect x="35.0" y="90" width="293.3333333333333" height="65" fill="#dbeaff" stroke="#204f80" stroke-width="3"/><text x="47.0" y="125" font-size="22">Requisito</text><rect x="328.3333333333333" y="90" width="293.3333333333333" height="65" fill="#dbeaff" stroke="#204f80" stroke-width="3"/><text x="340.3333333333333" y="125" font-size="22">Teste</text><rect x="621.6666666666666" y="90" width="293.3333333333333" height="65" fill="#dbeaff" stroke="#204f80" stroke-width="3"/><text x="633.6666666666666" y="125" font-size="22">Relatório</text><rect x="35.0" y="155" width="293.3333333333333" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="47.0" y="190" font-size="22">R1</text><rect x="328.3333333333333" y="155" width="293.3333333333333" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="340.3333333333333" y="190" font-size="22">T1 presente</text><rect x="621.6666666666666" y="155" width="293.3333333333333" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="633.6666666666666" y="190" font-size="22">L1 presente</text><rect x="35.0" y="220" width="293.3333333333333" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="47.0" y="255" font-size="22">R2</text><rect x="328.3333333333333" y="220" width="293.3333333333333" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="340.3333333333333" y="255" font-size="22">T2 presente</text><rect x="621.6666666666666" y="220" width="293.3333333333333" height="65" fill="#fff" stroke="#204f80" stroke-width="3"/><text x="633.6666666666666" y="255" font-size="22">L2 ausente</text><text x="30" y="596" font-size="16">Figura autoral • dados hipotéticos • sem limites legais • cotas e rótulos prevalecem</text></g></svg>