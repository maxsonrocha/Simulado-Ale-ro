<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">Circuito de ventilação com retorno indesejado</title><desc id="desc">Duto aspira ar pela abertura do recinto e devolve o ar pela mesma abertura, sem tratamento do agente X. As duas extremidades ficam próximas. O caminho não retira contaminante da fronteira.</desc><rect width="960" height="620" fill="white"/><g font-family="Arial,sans-serif" fill="#152d45"><text x="35" y="38" font-size="24">Circuito de ventilação com retorno indesejado</text><rect x="120" y="150" width="320" height="320" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="132" y="185" font-size="22">Recinto</text><rect x="210" y="350" width="130" height="80" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="222" y="385" font-size="22">Fonte X</text><circle cx="850" cy="350" r="17" fill="#e7ae77"/><line x1="850" y1="367" x2="850" y2="430" stroke="#243c56" stroke-width="12" stroke-dasharray=""/><line x1="850" y1="390" x2="822" y2="415" stroke="#243c56" stroke-width="8" stroke-dasharray=""/><line x1="850" y1="390" x2="878" y2="415" stroke="#243c56" stroke-width="8" stroke-dasharray=""/><line x1="850" y1="430" x2="825" y2="475" stroke="#243c56" stroke-width="9" stroke-dasharray=""/><line x1="850" y1="430" x2="875" y2="475" stroke="#243c56" stroke-width="9" stroke-dasharray=""/><line x1="440" y1="200" x2="780" y2="200" stroke="#31877c" stroke-width="9" stroke-dasharray=""/><line x1="780" y1="200" x2="780" y2="300" stroke="#31877c" stroke-width="9" stroke-dasharray=""/><line x1="780" y1="300" x2="450" y2="300" stroke="#31877c" stroke-width="9" stroke-dasharray=""/><text x="470" y="130" font-size="21">Aspiração aqui</text><text x="480" y="345" font-size="20">Descarga retorna à abertura</text><text x="60" y="520" font-size="20">Agente captado não é removido; o circuito devolve ao recinto.</text><text x="30" y="596" font-size="16">Figura autoral • dados hipotéticos • sem limites legais • cotas e rótulos prevalecem</text></g></svg>