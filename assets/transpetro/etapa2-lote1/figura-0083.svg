<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">Modelo térmico de dois caminhos paralelos</title><desc id="desc">Dois caminhos térmicos em paralelo, entre superfícies com diferença de temperatura de 12 K. Resistências R1=2 K/W e R2=6 K/W. Potência=ΔT/R.</desc><rect width="960" height="620" fill="white"/><g font-family="Arial,sans-serif" fill="#152d45"><text x="35" y="38" font-size="24">Modelo térmico de dois caminhos paralelos</text><rect x="70" y="200" width="130" height="90" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="82" y="235" font-size="22">Quente</text><rect x="710" y="200" width="130" height="90" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="722" y="235" font-size="22">Frio</text><line x1="200" y1="245" x2="300" y2="245" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><line x1="300" y1="145" x2="300" y2="365" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><rect x="380" y="115" width="190" height="65" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="392" y="150" font-size="22">R1=2 K/W</text><rect x="380" y="335" width="190" height="65" fill="#e4effc" stroke="#204f80" stroke-width="3"/><text x="392" y="370" font-size="22">R2=6 K/W</text><line x1="300" y1="145" x2="380" y2="145" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><line x1="300" y1="365" x2="380" y2="365" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><line x1="570" y1="145" x2="640" y2="145" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><line x1="570" y1="365" x2="640" y2="365" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><line x1="640" y1="145" x2="640" y2="365" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><line x1="640" y1="245" x2="710" y2="245" stroke="#204f80" stroke-width="3" stroke-dasharray=""/><text x="40" y="490" font-size="20">Mesmo ΔT=12 K em ambos os caminhos; potência térmica=ΔT/R.</text><text x="30" y="596" font-size="16">Figura autoral • dados hipotéticos • sem limites legais • cotas e rótulos prevalecem</text></g></svg>