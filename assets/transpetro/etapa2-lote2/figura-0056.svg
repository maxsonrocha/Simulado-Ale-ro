<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="ttl desc"><title id="ttl">Modelo de três demandas independentes</title><desc id="desc">Três demandas; probabilidade de falha em cada uma 0,2, independentes. P(exatamente uma)=3 p(1−p)². Dados transcritos: Parâmetro; Valor; n; 3; p; 0,2; Regra; 3 p(1−p)²</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#284c72"/></marker></defs><rect width="1000" height="640" fill="white"/><g fill="#172d45" font-family="Arial,sans-serif"><text x="35" y="40" font-size="24">Modelo de três demandas independentes</text><rect x="35.0" y="90" width="460.0" height="65" fill="#d8e8fa" stroke="#284c72" stroke-width="3"/><text x="47.0" y="122" font-size="20">Parâmetro</text><rect x="495.0" y="90" width="460.0" height="65" fill="#d8e8fa" stroke="#284c72" stroke-width="3"/><text x="507.0" y="122" font-size="20">Valor</text><rect x="35.0" y="155" width="460.0" height="65" fill="#fff" stroke="#284c72" stroke-width="3"/><text x="47.0" y="187" font-size="20">n</text><rect x="495.0" y="155" width="460.0" height="65" fill="#fff" stroke="#284c72" stroke-width="3"/><text x="507.0" y="187" font-size="20">3</text><rect x="35.0" y="220" width="460.0" height="65" fill="#fff" stroke="#284c72" stroke-width="3"/><text x="47.0" y="252" font-size="20">p</text><rect x="495.0" y="220" width="460.0" height="65" fill="#fff" stroke="#284c72" stroke-width="3"/><text x="507.0" y="252" font-size="20">0,2</text><rect x="35.0" y="285" width="460.0" height="65" fill="#fff" stroke="#284c72" stroke-width="3"/><text x="47.0" y="317" font-size="20">Regra</text><rect x="495.0" y="285" width="460.0" height="65" fill="#fff" stroke="#284c72" stroke-width="3"/><text x="507.0" y="317" font-size="20">3 p(1−p)²</text><text x="30" y="616" font-size="17">Figura autoral • modelo didático • critérios internos, não limites legais</text></g></svg>