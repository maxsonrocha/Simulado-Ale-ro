<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="ttl desc"><title id="ttl">Rotação e velocidade periférica</title><desc id="desc">Disco de diâmetro 0,20 m, rotação 3000 rpm. v=πdn/60; π3,1416. Critério interno: v≤30 m/s. Dados transcritos: Parâmetro; Valor; Diâmetro; 0,20 m; Rotação; 3000 rpm; Critério interno; v ≤ 30 m/s</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#284c72"/></marker></defs><rect width="1000" height="640" fill="white"/><g fill="#172d45" font-family="Arial,sans-serif"><text x="35" y="40" font-size="24">Rotação e velocidade periférica</text><rect x="35.0" y="90" width="460.0" height="65" fill="#d8e8fa" stroke="#284c72" stroke-width="3"/><text x="47.0" y="122" font-size="20">Parâmetro</text><rect x="495.0" y="90" width="460.0" height="65" fill="#d8e8fa" stroke="#284c72" stroke-width="3"/><text x="507.0" y="122" font-size="20">Valor</text><rect x="35.0" y="155" width="460.0" height="65" fill="#fff" stroke="#284c72" stroke-width="3"/><text x="47.0" y="187" font-size="20">Diâmetro</text><rect x="495.0" y="155" width="460.0" height="65" fill="#fff" stroke="#284c72" stroke-width="3"/><text x="507.0" y="187" font-size="20">0,20 m</text><rect x="35.0" y="220" width="460.0" height="65" fill="#fff" stroke="#284c72" stroke-width="3"/><text x="47.0" y="252" font-size="20">Rotação</text><rect x="495.0" y="220" width="460.0" height="65" fill="#fff" stroke="#284c72" stroke-width="3"/><text x="507.0" y="252" font-size="20">3000 rpm</text><rect x="35.0" y="285" width="460.0" height="65" fill="#fff" stroke="#284c72" stroke-width="3"/><text x="47.0" y="317" font-size="20">Critério interno</text><rect x="495.0" y="285" width="460.0" height="65" fill="#fff" stroke="#284c72" stroke-width="3"/><text x="507.0" y="317" font-size="20">v ≤ 30 m/s</text><text x="30" y="616" font-size="17">Figura autoral • modelo didático • critérios internos, não limites legais</text></g></svg>