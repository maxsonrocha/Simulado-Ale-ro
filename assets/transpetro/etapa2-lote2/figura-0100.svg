<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="ttl desc"><title id="ttl">Balanço ideal de efluentes</title><desc id="desc">A2 m³com5 molH+/m³; B1 m³com4 molOH−/m³; neutralização 1: 1. Ca(OH)2 fornece2 molOH−/mol,massamolar 74 g/mol. Semoutrasreações. Dados transcritos: Corrente A: ácida; Corrente B: básica; Tanque de mistura; A: 2 m³,5 mol H+/m³; B: 1 m³,4 mol OH−/m³; Ca(OH)2 fornece 2 mol OH−/mol; massa molar 74 g/mol.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#284c72"/></marker></defs><rect width="1000" height="640" fill="white"/><g fill="#172d45" font-family="Arial,sans-serif"><text x="35" y="40" font-size="24">Balanço ideal de efluentes</text><rect x="70" y="170" width="290" height="220" fill="#e2edfa" stroke="#284c72" stroke-width="3"/><text x="82" y="202" font-size="20">Corrente A: ácida</text><rect x="620" y="170" width="290" height="220" fill="#e2edfa" stroke="#284c72" stroke-width="3"/><text x="632" y="202" font-size="20">Corrente B: básica</text><line x1="360" y1="300" x2="480" y2="420" stroke="#284c72" stroke-width="3"/><line x1="620" y1="300" x2="480" y2="420" stroke="#284c72" stroke-width="3"/><rect x="380" y="420" width="230" height="100" fill="#e2edfa" stroke="#284c72" stroke-width="3"/><text x="392" y="452" font-size="20">Tanque de mistura</text><text x="50" y="110" font-size="21">A: 2 m³,5 mol H+/m³; B: 1 m³,4 mol OH−/m³</text><text x="40" y="560" font-size="20">Ca(OH)2 fornece 2 mol OH−/mol; massa molar 74 g/mol.</text><text x="30" y="616" font-size="17">Figura autoral • modelo didático • critérios internos, não limites legais</text></g></svg>