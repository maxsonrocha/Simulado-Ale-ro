<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="ttl desc"><title id="ttl">Interfaces e ações de controle</title><desc id="desc">CicloAB,BC,CD,DE,EA. CustosA4,B2,C3,D2,E4. Cada aresta coberta se pelo menos um extremo selecionado. Dados transcritos: AB; BC; CD; DE; EA; A: custo 4; B: custo 2; C: custo 3; D: custo 2; E: custo 4; Cada interface deve ter ao menos um dos extremos selecionado.; Minimizar a soma de custos, sem outras restrições.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#284c72"/></marker></defs><rect width="1000" height="640" fill="white"/><g fill="#172d45" font-family="Arial,sans-serif"><text x="35" y="40" font-size="24">Interfaces e ações de controle</text><line x1="195.0" y1="121.8359375" x2="370.0" y2="108.1640625" stroke="#284c72" stroke-width="3"/><text x="282.5" y="107.0" font-size="17">AB</text><line x1="515.0" y1="121.63194444444444" x2="730.0" y2="178.36805555555554" stroke="#284c72" stroke-width="3"/><text x="622.5" y="142.0" font-size="17">BC</text><line x1="780.15625" y1="225.0" x2="694.84375" y2="330.0" stroke="#284c72" stroke-width="3"/><text x="737.5" y="269.5" font-size="17">CD</text><line x1="600.0" y1="357.5" x2="315.0" y2="357.5" stroke="#284c72" stroke-width="3"/><text x="457.5" y="349.5" font-size="17">DE</text><line x1="228.15217391304347" y1="330.0" x2="136.84782608695653" y2="155.0" stroke="#284c72" stroke-width="3"/><text x="182.5" y="234.5" font-size="17">EA</text><rect x="50" y="100" width="145" height="55" fill="#e2edfa" stroke="#284c72" stroke-width="3"/><text x="62" y="132" font-size="20">A: custo 4</text><rect x="370" y="75" width="145" height="55" fill="#e2edfa" stroke="#284c72" stroke-width="3"/><text x="382" y="107" font-size="20">B: custo 2</text><rect x="730" y="170" width="145" height="55" fill="#e2edfa" stroke="#284c72" stroke-width="3"/><text x="742" y="202" font-size="20">C: custo 3</text><rect x="600" y="330" width="145" height="55" fill="#e2edfa" stroke="#284c72" stroke-width="3"/><text x="612" y="362" font-size="20">D: custo 2</text><rect x="170" y="330" width="145" height="55" fill="#e2edfa" stroke="#284c72" stroke-width="3"/><text x="182" y="362" font-size="20">E: custo 4</text><text x="35" y="455" font-size="19">Cada interface deve ter ao menos um dos extremos selecionado.</text><text x="35" y="487" font-size="19">Minimizar a soma de custos, sem outras restrições.</text><text x="30" y="616" font-size="17">Figura autoral • modelo didático • critérios internos, não limites legais</text></g></svg>