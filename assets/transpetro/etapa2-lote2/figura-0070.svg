<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="ttl desc"><title id="ttl">Modelo bayesiano de probabilidade</title><desc id="desc">Prior Beta(1,1); observação 2 eventos e 8 não eventos. Posterior Beta(3,9). Para duas novas demandas, P(ambas)=a(a+1)/[(a+b)(a+b+1)]. Dados transcritos: Modelo; Valor; Posterior a; 3; Posterior b; 9; P(ambas); a(a+1)/[(a+b)(a+b+1)]; Posterior Beta(a,b); E(p)=a/(a+b); independentes dado p.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#284c72"/></marker></defs><rect width="1000" height="640" fill="white"/><g fill="#172d45" font-family="Arial,sans-serif"><text x="35" y="40" font-size="24">Modelo bayesiano de probabilidade</text><rect x="35.0" y="90" width="460.0" height="65" fill="#d8e8fa" stroke="#284c72" stroke-width="3"/><text x="47.0" y="122" font-size="20">Modelo</text><rect x="495.0" y="90" width="460.0" height="65" fill="#d8e8fa" stroke="#284c72" stroke-width="3"/><text x="507.0" y="122" font-size="20">Valor</text><rect x="35.0" y="155" width="460.0" height="65" fill="#fff" stroke="#284c72" stroke-width="3"/><text x="47.0" y="187" font-size="20">Posterior a</text><rect x="495.0" y="155" width="460.0" height="65" fill="#fff" stroke="#284c72" stroke-width="3"/><text x="507.0" y="187" font-size="20">3</text><rect x="35.0" y="220" width="460.0" height="65" fill="#fff" stroke="#284c72" stroke-width="3"/><text x="47.0" y="252" font-size="20">Posterior b</text><rect x="495.0" y="220" width="460.0" height="65" fill="#fff" stroke="#284c72" stroke-width="3"/><text x="507.0" y="252" font-size="20">9</text><rect x="35.0" y="285" width="460.0" height="65" fill="#fff" stroke="#284c72" stroke-width="3"/><text x="47.0" y="317" font-size="20">P(ambas)</text><rect x="495.0" y="285" width="460.0" height="65" fill="#fff" stroke="#284c72" stroke-width="3"/><text x="507.0" y="317" font-size="20">a(a+1)/[(a+b)(a+b+1)]</text><text x="35" y="450" font-size="20">Posterior Beta(a,b); E(p)=a/(a+b); independentes dado p.</text><text x="30" y="616" font-size="17">Figura autoral • modelo didático • critérios internos, não limites legais</text></g></svg>