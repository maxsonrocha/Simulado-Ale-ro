<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="ttl desc"><title id="ttl">Coleta sob cobertura em ensaio</title><desc id="desc">Recipiente A coleta 12 L/min e B2 L/min sob sombra de aspersão. Critério interno: cada um≥20 L em 2 min; taxas constantes. Dados transcritos: Cobertura sobre B; Recipiente A; Recipiente B; A recebe 12 L/min; B recebe 2 L/min; Critério interno: cada recipiente deve coletar≥20 L em 2 min.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#284c72"/></marker></defs><rect width="1000" height="640" fill="white"/><g fill="#172d45" font-family="Arial,sans-serif"><text x="35" y="40" font-size="24">Coleta sob cobertura em ensaio</text><rect x="500" y="150" width="280" height="50" fill="#e2edfa" stroke="#284c72" stroke-width="3"/><text x="512" y="182" font-size="20">Cobertura sobre B</text><line x1="270" y1="90" x2="270" y2="340" stroke="#3985b8" stroke-width="3"/><line x1="660" y1="80" x2="660" y2="150" stroke="#3985b8" stroke-width="3"/><rect x="180" y="340" width="180" height="110" fill="#e2edfa" stroke="#284c72" stroke-width="3"/><text x="192" y="372" font-size="20">Recipiente A</text><rect x="570" y="340" width="180" height="110" fill="#e2edfa" stroke="#284c72" stroke-width="3"/><text x="582" y="372" font-size="20">Recipiente B</text><circle cx="825" cy="330" r="16" fill="#dfad7a"/><line x1="825" y1="346" x2="825" y2="410" stroke="#294057" stroke-width="10"/><line x1="825" y1="375" x2="800" y2="395" stroke="#294057" stroke-width="7"/><line x1="825" y1="375" x2="850" y2="395" stroke="#294057" stroke-width="7"/><line x1="825" y1="410" x2="805" y2="450" stroke="#294057" stroke-width="8"/><line x1="825" y1="410" x2="845" y2="450" stroke="#294057" stroke-width="8"/><text x="130" y="270" font-size="22">A recebe 12 L/min</text><text x="540" y="270" font-size="22">B recebe 2 L/min</text><text x="50" y="510" font-size="20">Critério interno: cada recipiente deve coletar≥20 L em 2 min.</text><text x="30" y="616" font-size="17">Figura autoral • modelo didático • critérios internos, não limites legais</text></g></svg>