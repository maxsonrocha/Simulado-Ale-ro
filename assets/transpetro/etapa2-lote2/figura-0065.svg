<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="ttl desc"><title id="ttl">Amostragem com reposição</title><desc id="desc">Três classes equiprováveis. Três seleções independentes com reposição; todas as sequências têm probabilidade 1/27. Dados transcritos: Parâmetro; Valor; Classes; A, B, C; Seleções; 3 com reposição; Sequências possíveis; 27 equiprováveis</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#284c72"/></marker></defs><rect width="1000" height="640" fill="white"/><g fill="#172d45" font-family="Arial,sans-serif"><text x="35" y="40" font-size="24">Amostragem com reposição</text><rect x="35.0" y="90" width="460.0" height="65" fill="#d8e8fa" stroke="#284c72" stroke-width="3"/><text x="47.0" y="122" font-size="20">Parâmetro</text><rect x="495.0" y="90" width="460.0" height="65" fill="#d8e8fa" stroke="#284c72" stroke-width="3"/><text x="507.0" y="122" font-size="20">Valor</text><rect x="35.0" y="155" width="460.0" height="65" fill="#fff" stroke="#284c72" stroke-width="3"/><text x="47.0" y="187" font-size="20">Classes</text><rect x="495.0" y="155" width="460.0" height="65" fill="#fff" stroke="#284c72" stroke-width="3"/><text x="507.0" y="187" font-size="20">A, B, C</text><rect x="35.0" y="220" width="460.0" height="65" fill="#fff" stroke="#284c72" stroke-width="3"/><text x="47.0" y="252" font-size="20">Seleções</text><rect x="495.0" y="220" width="460.0" height="65" fill="#fff" stroke="#284c72" stroke-width="3"/><text x="507.0" y="252" font-size="20">3 com reposição</text><rect x="35.0" y="285" width="460.0" height="65" fill="#fff" stroke="#284c72" stroke-width="3"/><text x="47.0" y="317" font-size="20">Sequências possíveis</text><rect x="495.0" y="285" width="460.0" height="65" fill="#fff" stroke="#284c72" stroke-width="3"/><text x="507.0" y="317" font-size="20">27 equiprováveis</text><text x=