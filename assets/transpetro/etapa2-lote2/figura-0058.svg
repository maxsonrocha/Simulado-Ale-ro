<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="ttl desc"><title id="ttl">Restrições de um modelo de perdas</title><desc id="desc">X perde 0,10,100 com probabilidades p0,p1,p2. Restrições: p0+p1+p2=1, todas≥0; p1+2 p2≤0,3; p2≤0,02. Y perde 4,8 com certeza. Dados transcritos: Objeto; Definição; X: perdas; 0 / 10 / 100; Restrição; p1 + 2 p2 ≤ 0,3; Restrição; p2 ≤ 0,02; Y; Perda certa 4,8; p0+p1+p2=1; todas não negativas; perdas exaustivas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#284c72"/></marker></defs><rect width="1000" height="640" fill="white"/><g fill="#172d45" font-family="Arial,sans-serif"><text x="35" y="40" font-size="24">Restrições de um modelo de perdas</text><rect x="35.0" y="90" width="460.0" height="65" fill="#d8e8fa" stroke="#284c72" stroke-width="3"/><text x="47.0" y="122" font-size="20">Objeto</text><rect x="495.0" y="90" width="460.0" height="65" fill="#d8e8fa" stroke="#284c72" stroke-width="3"/><text x="507.0" y="122" font-size="20">Definição</text><rect x="35.0" y="155" width="460.0" height="65" fill="#fff" stroke="#284c72" stroke-width="3"/><text x="47.0" y="187" font-size="20">X: perdas</text><rect x="495.0" y="155" width="460.0" height="65" fill="#fff" stroke="#284c72" stroke-width="3"/><text x="507.0" y="187" font-size="20">0 / 10 / 100</text><rect x="35.0" y="220" width="460.0" height="65" fill="#fff" stroke="#284c72" stroke-width="3"/><text x="47.0" y="252" font-size="20">Restrição</text><rect x="495.0" y="220" width="460.0" height="65" fill="#fff" stroke="#284c72" stroke-width="3"/><text x="507.0" y="252" font-size="20">p1 + 2 p2 ≤ 0,3</text><rect x="35.0" y="285" width="460.0" height="65" fill="#fff" stroke="#284c72" stroke-width="3"/><text x="47.0" y="317" font-size="20">Restrição</text><rect x="495.0" y="285" width="460.0" height="65" fill="#fff" stroke="#284c72" stroke-width="3"/><text x="507.0" y="317" font-size="20">p2 ≤ 0,02</text><rect x="35.0" y="350" width="460.0" height="65" fill="#fff" stroke="#284c72" stroke-width="3"/><text x="47.0" y="382" font-size="20">Y</text><rect x="495.0" y="350" width="460.0" height="65" fill="#fff" stroke="#284c72" stroke-width="3"/><text x="507.0" y="382" font-size="20">Perda certa 4,8</text><text x="35" y="535" font-size="20">p0+p1+p2=1; todas não negativas; perdas exaustivas.</text><text x="30" y="616" font-size="17">Figura autoral • modelo didático • critérios internos, não limites legais</text></g></svg>