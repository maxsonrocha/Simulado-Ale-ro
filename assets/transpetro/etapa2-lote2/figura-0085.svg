<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="ttl desc"><title id="ttl">Perfil simplificado de uma rota</title><desc id="desc">Rota com subida 3 m eavanço horizontal 4 m. Critériointernosubida/avanço≤0,60. Dados transcritos: Avanço horizontal: 4 m; Subida: 3 m; Critério interno de exercício: subida/avanço ≤ 0,60.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#284c72"/></marker></defs><rect width="1000" height="640" fill="white"/><g fill="#172d45" font-family="Arial,sans-serif"><text x="35" y="40" font-size="24">Perfil simplificado de uma rota</text><line x1="100" y1="400" x2="760" y2="400" stroke="#284c72" stroke-width="3"/><line x1="150" y1="400" x2="550" y2="100" stroke="#284c72" stroke-width="3"/><line x1="550" y1="100" x2="550" y2="400" stroke="#284c72" stroke-width="3"/><text x="270" y="450" font-size="23">Avanço horizontal: 4 m</text><text x="580" y="250" font-size="22">Subida: 3 m</text><text x="40" y="510" font-size="20">Critério interno de exercício: subida/avanço ≤ 0,60.</text><text x="30" y="616" font-size="17">Figura autoral • modelo didático • critérios internos, não limites legais</text></g></svg>