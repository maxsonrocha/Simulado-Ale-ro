<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="ttl desc"><title id="ttl">Grafo causal de uma associação</title><desc id="desc">A causa X eY; não há seta diretaX-Y nem outras causas comuns; erros independentes. Dados transcritos: causa; causa; A; X; Y; Modelo causal completo para o exercício: A→X e A→Y.; Não há seta X→Y nem Y→X; erros externos independentes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#284c72"/></marker></defs><rect width="1000" height="640" fill="white"/><g fill="#172d45" font-family="Arial,sans-serif"><text x="35" y="40" font-size="24">Grafo causal de uma associação</text><line x1="370.5263157894737" y1="155.0" x2="164.4736842105263" y2="290.0" stroke="#284c72" stroke-width="3" marker-end="url(#arrow)"/><text x="267.5" y="214.5" font-size="17">causa</text><line x1="464.60526315789474" y1="155.0" x2="720.3947368421052" y2="290.0" stroke="#284c72" stroke-width="3" marker-end="url(#arrow)"/><text x="592.5" y="214.5" font-size="17">causa</text><rect x="340" y="100" width="145" height="55" fill="#e2edfa" stroke="#284c72" stroke-width="3"/><text x="352" y="132" font-size="20">A</text><rect x="50" y="290" width="145" height="55" fill="#e2edfa" stroke="#284c72" stroke-width="3"/><text x="62" y="322" font-size="20">X</text><rect x="700" y="290" width="145" height="55" fill="#e2edfa" stroke="#284c72" stroke-width="3"/><text x="712" y="322" font-size="20">Y</text><text x="35" y="455" font-size="19">Modelo causal completo para o exercício: A→X e A→Y.</text><text x="35" y="487" font-size="19">Não há seta X→Y nem Y→X; erros externos independentes.</text><text x="30" y="616" font-size="17">Figura autoral • modelo didático • critérios internos, não limites legais</text></g></svg>