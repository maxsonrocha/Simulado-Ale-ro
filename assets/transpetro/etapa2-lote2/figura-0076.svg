<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="ttl desc"><title id="ttl">Modelo de propagação dirigida</title><desc id="desc">Origem→A permitida; Origem→B bloqueada; A→C permitida. Não há outras conexões. Dados transcritos: permitida; bloqueada; permitida; Origem; A; B; C; Sentido das conexões: Origem→A, Origem→B, A→C.; Só conexões permitidas podem ser percorridas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#284c72"/></marker></defs><rect width="1000" height="640" fill="white"/><g fill="#172d45" font-family="Arial,sans-serif"><text x="35" y="40" font-size="24">Modelo de propagação dirigida</text><line x1="185.0" y1="205.75" x2="340.0" y2="159.25" stroke="#284c72" stroke-width="3" marker-end="url(#arrow)"/><text x="262.5" y="174.5" font-size="17">permitida</text><line x1="185.0" y1="251.66666666666666" x2="340.0" y2="303.3333333333333" stroke="#284c72" stroke-width="3" marker-end="url(#arrow)"/><text x="262.5" y="269.5" font-size="17">bloqueada</text><line x1="485.0" y1="154.67105263157896" x2="720.0" y2="210.32894736842104" stroke="#284c72" stroke-width="3" marker-end="url(#arrow)"/><text x="602.5" y="174.5" font-size="17">permitida</text><rect x="40" y="200" width="145" height="55" fill="#e2edfa" stroke="#284c72" stroke-width="3"/><text x="52" y="232" font-size="20">Origem</text><rect x="340" y="110" width="145" height="55" fill="#e2edfa" stroke="#284c72" stroke-width="3"/><text x="352" y="142" font-size="20">A</text><rect x="340" y="300" width="145" height="55" fill="#e2edfa" stroke="#284c72" stroke-width="3"/><text x="352" y="332" font-size="20">B</text><rect x="720" y="200" width="145" height="55" fill="#e2edfa" stroke="#284c72" stroke-width="3"/><text x="732" y="232" font-size="20">C</text><text x="35" y="455" font-size="19">Sentido das conexões: Origem→A, Origem→B, A→C.</text><text x="35" y="487" font-size="19">Só conexões permitidas podem ser percorridas.</text><text x="30" y="616" font-size="17">Figura autoral • modelo didático • critérios internos, não limites legais</text></g></svg>