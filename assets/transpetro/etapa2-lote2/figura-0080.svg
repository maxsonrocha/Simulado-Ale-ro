<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="ttl desc"><title id="ttl">Canais proporcionais e informação adicional</title><desc id="desc">Canal1: 2 A+4 B=10; Canal2: 3 A+6 B=15. Canal adicional validado: A−B=1. Dados transcritos: 2 A+4 B; 3 A+6 B; Agentes A,B; Canal 1: 10; Canal 2: 15; Canal adicional validado: A−B=1.; Primeiro par é proporcional; não fornece duas equações independentes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#284c72"/></marker></defs><rect width="1000" height="640" fill="white"/><g fill="#172d45" font-family="Arial,sans-serif"><text x="35" y="40" font-size="24">Canais proporcionais e informação adicional</text><line x1="175.0" y1="168.4375" x2="350.0" y2="146.5625" stroke="#284c72" stroke-width="3" marker-end="url(#arrow)"/><text x="262.5" y="149.5" font-size="17">2 A+4 B</text><line x1="167.68518518518516" y1="205.0" x2="357.31481481481484" y2="285.0" stroke="#284c72" stroke-width="3" marker-end="url(#arrow)"/><text x="262.5" y="237.0" font-size="17">3 A+6 B</text><rect x="30" y="150" width="145" height="55" fill="#e2edfa" stroke="#284c72" stroke-width="3"/><text x="42" y="182" font-size="20">Agentes A,B</text><rect x="350" y="110" width="145" height="55" fill="#e2edfa" stroke="#284c72" stroke-width="3"/><text x="362" y="142" font-size="20">Canal 1: 10</text><rect x="350" y="285" width="145" height="55" fill="#e2edfa" stroke="#284c72" stroke-width="3"/><text x="362" y="317" font-size="20">Canal 2: 15</text><text x="35" y="455" font-size="19">Canal adicional validado: A−B=1.</text><text x="35" y="487" font-size="19">Primeiro par é proporcional; não fornece duas equações independentes.</text><text x="30" y="616" font-size="17">Figura autoral • modelo didático • critérios internos, não limites legais</text></g></svg>