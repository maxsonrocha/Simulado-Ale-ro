c72" stroke-width="3"/><text x="742" y="232" font-size="20">D</text><text x="35" y="455" font-size="19">Setas significam precedência comprovada por registros causais.</text><text x="35" y="487" font-size="19">Nenhum outro vínculo de precedência é fornecido.</text><text x="30" y="616" font-size="17">Figura autoral • modelo didático • critérios internos, não limites legais</text></g></svg>