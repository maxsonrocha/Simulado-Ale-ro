<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="ttl desc"><title id="ttl">Emissão por serviço concluído</title><desc id="desc">A: 4 kg por tentativa, sucesso 0,8 independente, repetir até sucesso; emissão fixa 10 kg por 20 serviços. B: 5,4 kg por tentativa,sucesso 1,fixa 0. E(tentativas)=1/p. Dados transcritos: Opção; kg/tentativa; p sucesso; Fixa/20; A; 4; 0,8; 10 kg; B; 5,4; 1; 0 kg; Repetir até sucesso; tentativas independentes; E(N)=1/p.; Emissão fixa rateada por 20 serviços concluídos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#284c72"/></marker></defs><rect width="1000" height="640" fill="white"/><g fill="#172d45" font-family="Arial,sans-serif"><text x="35" y="40" font-size="24">Emissão por serviço concluído</text><rect x="35.0" y="90" width="230.0" height="65" fill="#d8e8fa" stroke="#284c72" stroke-width="3"/><text x="47.0" y="122" font-size="20">Opção</text><rect x="265.0" y="90" width="230.0" height="65" fill="#d8e8fa" stroke="#284c72" stroke-width="3"/><text x="277.0" y="122" font-size="20">kg/tentativa</text><rect x="495.0" y="90" width="230.0" height="65" fill="#d8e8fa" stroke="#284c72" stroke-width="3"/><text x="507.0" y="122" font-size="20">p sucesso</text><rect x="725.0" y="90" width="230.0" height="65" fill="#d8e8fa" stroke="#284c72" stroke-width="3"/><text x="737.0" y="122" font-size="20">Fixa/20</text><rect x="35.0" y="155" width="230.0" height="65" fill="#fff" stroke="#284c72" stroke-width="3"/><text x="47.0" y="187" font-size="20">A</text><rect x="265.0" y="155" width="230.0" height="65" fill="#fff" stroke="#284c72" stroke-width="3"/><text x="277.0" y="187" font-size="20">4</text><rect x="495.0" y="155" width="230.0" height="65" fill="#fff" stroke="#284c72" stroke-width="3"/><text x="507.0" y="187" font-size="20">0,8</text><rect x="725.0" y="155" width="230.0" height="65" fill="#fff" stroke="#284c72" stroke-width="3"/><text x="737.0" y="187" font-size="20">10 kg</text><rect x="35.0" y="220" width="230.0" height="65" fill="#fff" stroke="#284c72" stroke-width="3"/><text x="47.0" y="252" font-size="20">B</text><rect x="265.0" y="220" width="230.0" height="65" fill="#fff" stroke="#284c72" stroke-width="3"/><text x="277.0" y="252" font-size="20">5,4</text><rect x="495.0" y="220" width="230.0" height="65" fill="#fff" stroke="#284c72" stroke-width="3"/><text x="507.0" y="252" font-size="20">1</text><rect x="725.0" y="220" width="230.0" height="65" fill="#fff" stroke="#284c72" stroke-width="3"/><text x="737.0" y="252" font-size="20">0 kg</text><text x="35" y="440" font-size="20">Repetir até sucesso; tentativas independentes; E(N)=1/p.</text><text x="35" y="490" font-size="20">Emissão fixa rateada por 20 serviços concluídos.</text><text x="30" y="616" font-size="17">Figura autoral • modelo didático • critérios internos, não limites legais</text></g></svg>