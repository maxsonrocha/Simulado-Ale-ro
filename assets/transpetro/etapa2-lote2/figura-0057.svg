<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="ttl desc"><title id="ttl">Decomposição de variância</title><desc id="desc">Variâncias parciais VA2,VB3,VAB5,total 10. Índice de primeira ordem deA=VA/V; índice total deA=(VA+VAB)/V. Dados transcritos: Variância (unidades²); ; A; 2; ; B; 3; ; Interação AB; 5; S_A=VA/Vtotal; ST_A=(VA+VAB)/Vtotal; total=VA+VB+VAB.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#284c72"/></marker></defs><rect width="1000" height="640" fill="white"/><g fill="#172d45" font-family="Arial,sans-serif"><text x="35" y="40" font-size="24">Decomposição de variância</text><line x1="120" y1="440" x2="850" y2="440" stroke="#284c72" stroke-width="3"/><line x1="120" y1="110" x2="120" y2="440" stroke="#284c72" stroke-width="3"/><text x="120" y="80" font-size="20">Variância (unidades²)</text><rect x="180" y="340" width="100" height="100" fill="#e2edfa" stroke="#284c72" stroke-width="3"/><text x="192" y="372" font-size="20"></text><text x="190" y="470" font-size="18">A</text><text x="210" y="330" font-size="20">2</text><rect x="410" y="290" width="100" height="150" fill="#e2edfa" stroke="#284c72" stroke-width="3"/><text x="422" y="322" font-size="20"></text><text x="420" y="470" font-size="18">B</text><text x="440" y="280" font-size="20">3</text><rect x="640" y="190" width="100" height="250" fill="#e2edfa" stroke="#284c72" stroke-width="3"/><text x="652" y="222" font-size="20"></text><text x="650" y="470" font-size="18">Interação AB</text><text x="670" y="180" font-size="20">5</text><text x="35" y="530" font-size="20">S_A=VA/Vtotal; ST_A=(VA+VAB)/Vtotal; total=VA+VB+VAB.</text><text x="30" y="616" font-size="17">Figura autoral • modelo didático • critérios internos, não limites legais</text></g></svg>